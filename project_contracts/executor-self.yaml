{
  "schema_version": "executor-project/1.0",
  "project": {
    "name": "Creative OS Executor",
    "repository": "JTJ07/Executor",
    "entrypoint": "README.md"
  },
  "authoritative_sources": [
    {
      "path": "CREATIVE_OS_EXECUTOR_PRODUCT_PURPOSE_AND_BOUNDARIES_v1.0.md",
      "role": "authoritative_instruction"
    },
    {
      "path": "EXECUTOR_POLICY.yaml",
      "role": "authoritative_instruction"
    },
    {
      "path": "docs/governance/HUMAN_INTERACTION_CONTRACT_POINTER.md",
      "role": "authoritative_instruction"
    },
    {
      "path": "ACTION_AUTHORIZATION_PACKET_v1.0.md",
      "role": "authoritative_instruction"
    },
    {
      "path": "README.md",
      "role": "state_owner"
    }
  ],
  "commands": {
    "setup": [],
    "unit_test": [
      "python -m unittest discover -s tests -v"
    ],
    "integration_test": [],
    "full_verify": [
      "python -m unittest discover -s tests -v",
      "python -m compileall -q executor"
    ]
  },
  "path_rules": {
    "CREATIVE_OS_EXECUTOR_*.md": {
      "class": "semantic",
      "approval": "USER"
    },
    "ACTION_AUTHORIZATION_PACKET_v1.0.md": {
      "class": "semantic",
      "approval": "USER"
    },
    "EXECUTOR_POLICY.yaml": {
      "class": "semantic",
      "approval": "USER"
    },
    ".github/workflows/**": {
      "class": "infrastructure",
      "approval": "USER"
    },
    "schemas/**": {
      "class": "technical",
      "approval": "AI"
    },
    "executor/**": {
      "class": "technical",
      "approval": "AI"
    },
    "tests/**": {
      "class": "test",
      "approval": "AI"
    },
    "**": {
      "class": "unknown",
      "approval": "USER"
    }
  },
  "change_impact_rules": {
    "public_api_change": "USER",
    "data_schema_change": "USER",
    "result_semantics_change": "USER"
  },
  "capabilities": {
    "network": {
      "default": false
    },
    "secrets": {
      "default": []
    },
    "commands": {
      "allow": [
        "python",
        "git"
      ],
      "rules": [
        {
          "executable": "python",
          "argv_prefix": [
            "-m",
            "unittest"
          ]
        },
        {
          "executable": "python",
          "argv_prefix": [
            "-m",
            "compileall"
          ]
        },
        {
          "executable": "python",
          "argv_prefix": [
            "-m",
            "executor.cli"
          ]
        },
        {
          "executable": "git",
          "argv_prefix": [
            "status"
          ]
        },
        {
          "executable": "git",
          "argv_prefix": [
            "diff"
          ]
        }
      ]
    },
    "dependencies": {
      "install": "none"
    }
  },
  "environment": {
    "python": "3.11",
    "max_cpu": 2,
    "max_memory_mb": 4096,
    "max_disk_mb": 2048,
    "timeout_minutes": 30,
    "home_access": false
  },
  "artifacts": {
    "output": "artifacts/**",
    "baseline": "baselines/**"
  },
  "rollback": {
    "strategy": "git_reset"
  },
  "owners": {
    "semantic_changes": "USER",
    "technical_changes": "AI",
    "infrastructure_changes": "USER"
  }
}
