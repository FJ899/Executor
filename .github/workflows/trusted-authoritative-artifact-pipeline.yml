name: Trusted authoritative artifact pipeline

on:
  workflow_dispatch:

jobs:
  producer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          echo hello > out/test.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: P1_TEST_ARTIFACT
          path: out

  consumer:
    needs: producer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: P1_TEST_ARTIFACT
          path: downloaded

      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          cat downloaded/test.txt
          echo DOWNLOAD_PASS
