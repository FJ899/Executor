name: One-shot patch frozen product transport validator

on:
  push:
    branches:
      - ops/accept005-live-e2e
    paths:
      - .github/workflows/patch-frozen-product-transport-validator.yml

permissions:
  contents: write

jobs:
  patch-product-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout current product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: product/e2e-formation-provider-draft-pr
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Assert exact old validator blob
        shell: bash
        run: test "$(git rev-parse HEAD:executor/frozen_pilot_authority.py)" = '5835328b31671adfceba49ba7385931cecbe4ef9'

      - name: Fetch and apply exact patch script
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/FJ899/Executor/bbfea2f798da993cd177d1b88691ce48621863fb/tools/patch_frozen_product_transport_validator.py' -o "${RUNNER_TEMP}/patch.py"
          python "${RUNNER_TEMP}/patch.py"

      - name: Run targeted authority regression tests
        shell: bash
        run: python -m unittest tests.test_frozen_product_transport_authority -v

      - name: Commit and push exact validator fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name FJ8
          git config user.email frommjenny899@gmail.com
          git add executor/frozen_pilot_authority.py
          git commit -m 'Honor zero-authority Formation transport in frozen gate'
          git push origin HEAD:product/e2e-formation-provider-draft-pr
