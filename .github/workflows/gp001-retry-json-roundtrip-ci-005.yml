name: GP001 retry JSON round trip verification

on:
  push:
    branches:
      - ops/gp001-retry-json-roundtrip-ci-005

permissions:
  contents: read

jobs:
  test:
    if: github.event.head_commit.message == 'Verify GP001 retry JSON round trip once'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: d9245715021a15a336112ccd0d779fbb8e7f4d73
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps .
      - name: Run draft PR retry regression tests
        run: |
          python -m unittest \
            tests.test_product_draft_pr_retry \
            tests.test_product_draft_pr_retry_json_roundtrip
