name: Trusted controller manifest test

on:
  workflow_dispatch:

jobs:
  trusted-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: controller
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: candidate
          ref: agent/pilot-runtime-replacement
          persist-credentials: false
          fetch-depth: 0

      - name: Python manifest
        shell: bash
        env:
          ADR_SHA: bf18638caeb1a01cd2e14e625d72a20893a04bb3
          EXPECTED_SHA: 3f6e4196af4b9144ceaaba08f2b6637acdc1698d
        run: |
          set -euo pipefail

          actual_sha="$(git -C candidate rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"

          parent_sha="$(git -C candidate rev-parse HEAD^)"
          test "$parent_sha" = "$ADR_SHA"

          python - "$actual_sha" "$parent_sha" <<'PY'
          import json, sys

          candidate_sha, parent_sha = sys.argv[1:]

          manifest = {
              "candidate_sha": candidate_sha,
              "parent_sha": parent_sha,
              "status": "PASS",
          }

          print(json.dumps(manifest, indent=2))
          PY

          echo "MANIFEST_PASS"
