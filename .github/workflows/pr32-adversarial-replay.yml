name: PR32 independent adversarial replay

on:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    if: ${{ github.event.pull_request.number == 37 && github.head_ref == 'agent/pr32-ledger-fix-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact green candidate tree
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: litrgratis-pixel/Executor
          ref: 64241419d8bc0bde1f9920edfb88128f49d9a71f
          fetch-depth: 2
          persist-credentials: false

      - name: Replay accepted targeted regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools/p1_verifier tests/test_p1_verifier.py
          python -m unittest tests.test_p1_verifier -v

      - name: Prove supplementary root-group grammar bypass
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests import test_p1_verifier as broker

          image = 'sha256:' + '2' * 64
          argv = [
              'create', '--name', 'cos-executor-adversarial',
              '--network', 'none', '--read-only',
              '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges',
              '--pids-limit', '16', '--memory', '64m', '--cpus', '1.0',
              '--user', '65534:65534', '--group-add', '0',
              '--env', 'HOME=/nonexistent', '--workdir', '/source',
              '--mount',
              'type=bind,src=/candidate/case-001/tests/fixtures/sandbox,dst=/source,readonly',
              '--tmpfs', '/workspace:rw,nosuid,nodev,size=8m,mode=1777',
              '--tmpfs', '/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777',
              image, 'python', '/source/sandbox_fixture.py', 'read_source',
          ]
          allowed, command_class, reason = broker.classify_broker_argv(
              argv,
              git_image='git-image',
              sandbox_image_id=image,
              canonical_url=broker.CANONICAL_URL,
              created=set(),
          )
          assert allowed is True, (allowed, command_class, reason)
          print('EXPECTED_RED_P1_001: supplementary root group was accepted')
          PY

      - name: Prove failed CASE transcript can preserve PASS
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from tests import test_p1_verifier as broker

          sandbox_id = 'sha256:' + '2' * 64
          events = []
          sequence = 0

          def append(value):
              global sequence
              sequence += 1
              events.append({'sequence': sequence, **value})

          def pair(request_id, argv, command_class, case_id):
              argv_hash = broker._sha256_bytes(broker._canonical_bytes(argv))
              append({
                  'phase': 'request', 'request_id': request_id,
                  'argv': argv, 'argv_sha256': argv_hash,
                  'decision': 'ALLOW', 'command_class': command_class,
                  'reason': '', 'case_id': case_id,
              })
              append({
                  'phase': 'response', 'request_id': request_id,
                  'request_argv_sha256': argv_hash,
                  'returncode': 125,
                  'stdout_sha256': broker._sha256_text(''),
                  'stderr_sha256': broker._sha256_text('failed'),
                  'duration_seconds': 0.01,
                  'inspection': None, 'inspection_sha256': None,
              })

          for index, case_id in enumerate(('001', '002', '003'), 1):
              commit = str(index) * 40
              acquisition = broker.AdversarialBrokerRegressionTests()._network_git_argv()
              acquisition = [
                  item.replace('/runs/case-001/', f'/runs/case-{case_id}/')
                  for item in acquisition
              ]
              acquisition[acquisition.index('git-image')] = broker.GIT_IMAGE_REF
              acquisition[-1] = f'+{commit}:refs/executor/input'
              pair(f'acquisition-{case_id}', acquisition, 'broker-owned-acquisition', case_id)

              sandbox = [
                  'create', '--name', f'cos-executor-{case_id}',
                  '--network', 'none', '--read-only',
                  '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges',
                  '--pids-limit', '16', '--memory', '64m', '--cpus', '1.0',
                  '--user', '65534:65534', '--env', 'HOME=/nonexistent',
                  '--workdir', '/source', '--mount',
                  f'type=bind,src=/candidate/case-{case_id}/tests/fixtures/sandbox,dst=/source,readonly',
                  '--tmpfs', '/workspace:rw,nosuid,nodev,size=8m,mode=1777',
                  '--tmpfs', '/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777',
                  sandbox_id, 'python', '/source/sandbox_fixture.py', 'read_source',
              ]
              pair(f'sandbox-{case_id}', sandbox, 'create-sandbox', case_id)

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              broker._write_json(root / 'docker-command-ledger.json', {
                  'schema_version': 1,
                  'broker_authority': broker.BROKER_AUTHORITY,
                  'ready_before_candidate': True,
                  'complete': True,
                  'overflow': False,
                  'broker_error': None,
                  'candidate_endpoint': broker.BROKER_ENDPOINT,
                  'direct_daemon_endpoint_exposed': False,
                  'events': events,
              })
              broker._write_json(root / 'approved-nested-images.json', {
                  'images': {broker.SANDBOX_IMAGE_REF: {'id': sandbox_id}},
              })
              gate_path = root / 'authoritative-final-gate.json'
              broker._write_json(gate_path, {
                  'schema_version': 2,
                  'authoritative_result': 'PASS',
                  'errors': [],
                  'warnings': [],
              })
              gate = broker.apply_broker_gate(
                  execution_dir=root,
                  gate_path=gate_path,
                  output_path=root / 'broker-verification.json',
              )
              assert gate['authoritative_result'] == 'PASS', gate
              print('EXPECTED_RED_P1_006: six failed operations preserved PASS')
          PY

      - name: Prove broker-owned volume conflicts with verifier mount contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          broker = Path('tests/test_p1_verifier.py').read_text(encoding='utf-8')
          acceptance = json.loads(Path('tools/p1_verifier/acceptance_manifest.json').read_text())
          verifier = Path('tools/p1_verifier/verify_candidate.py').read_text(encoding='utf-8')
          assert 'type=volume,src={volume},dst=/trusted' in broker
          assert acceptance['allowed_nested_mount_sources'] == ['/candidate', '/runs']
          assert 'mount source is outside isolated roots' in verifier
          print('EXPECTED_INTEGRATION_REWORK: broker volume is outside verifier allowlist')
          PY
