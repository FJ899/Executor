name: Chat GP001 request 004 read-only reconciliation

on:
  push:
    branches:
      - ops/chat-fresh-gp001-request-004

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact verified product runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: python -m pip install --no-deps .

      - name: Download exact publisher artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9627907307
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33024628387

      - name: Recover exact Issue 95 publication without write and derive Human binding
        shell: bash
        run: |
          set -euo pipefail
          root="$(find evidence -type f -name formation.json -printf '%h\n' -quit)"
          test -n "$root"
          python - "$root" <<'PY'
          import json, sys
          from pathlib import Path
          from executor.formation_publication_recovery import recover_formation_publication
          from executor.github_trust import GitHubRestClient, GitHubTrustProfile
          from executor.pilot_contract import build_pilot_draft_from_formation, pilot_draft_sha256
          from executor.product_github_authority import verify_formation_published_request
          root=Path(sys.argv[1])
          formation=json.load(open(root/'formation.json',encoding='utf-8'))
          incomplete=json.load(open(root/'publication.json',encoding='utf-8'))
          recovered=recover_formation_publication(
              incomplete_publication=incomplete,
              evidence_directory=root/'effect-evidence',
              source=GitHubRestClient(),
          )
          if recovered.get('status')!='AWAITING_VERIFIED_HUMAN_DECISION': raise SystemExit('recovery did not reach Human boundary')
          t=recovered.get('request_transport_provenance') or {}
          if t.get('object_id')!='95' or t.get('authority') is not False or t.get('external_write_repeated') is not False: raise SystemExit('recovered transport identity mismatch')
          canonical=recovered['canonical_contract_request']; payload=recovered['github_request_payload']
          profile=GitHubTrustProfile.from_dict(json.load(open('trust_profiles/github-product-gp001.json',encoding='utf-8')))
          request=verify_formation_published_request(GitHubRestClient(),profile=profile,issue_number=95,expected_payload=payload)
          draft=build_pilot_draft_from_formation(canonical,request,formation_publication=recovered)
          summary={
            'issue_number':95,
            'issue_url':'https://github.com/FJ899/Executor/issues/95',
            'issue_node_id':request.issue_node_id,
            'request_body_sha256':request.body_sha256,
            'pilot_draft_sha256':pilot_draft_sha256(draft),
            'request_expires_at':payload['expires_at'],
            'transport_authority':False,
            'external_write_repeated':False,
          }
          print('HUMAN_BINDING='+json.dumps(summary,sort_keys=True))
          PY
