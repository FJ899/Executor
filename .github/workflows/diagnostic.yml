name: GP001 ACCEPT-005 read-only postmortem

on:
  push:
    branches:
      - ops/fresh-gp001-request-003

permissions:
  actions: read
  contents: read

jobs:
  inspect-failed-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact failed-run artifact read only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/FJ899/Executor/actions/artifacts/9627212339/zip' \
            -o "${RUNNER_TEMP}/accept005.zip"
          mkdir -p "${RUNNER_TEMP}/accept005"
          unzip -q "${RUNNER_TEMP}/accept005.zip" -d "${RUNNER_TEMP}/accept005"

      - name: Show exact decide result and file inventory
        shell: bash
        run: |
          set -euo pipefail
          find "${RUNNER_TEMP}/accept005" -type f -print | sort
          frozen="$(find "${RUNNER_TEMP}/accept005" -type f -name frozen.json -print -quit)"
          test -n "$frozen"
          echo '--- FROZEN_JSON_BEGIN ---'
          cat "$frozen"
          echo
          echo '--- FROZEN_JSON_END ---'

      - name: Confirm target still has no pull requests
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/FJ899/executor-pilot-target/pulls?state=all&per_page=100' \
            | python -c 'import json,sys; v=json.load(sys.stdin); print("TARGET_PR_COUNT="+str(len(v))); print(json.dumps(v,sort_keys=True))'
