name: GP001 ACCEPT-005 exact bounded product continuation

on:
  push:
    branches:
      - ops/fresh-gp001-request-003

permissions:
  contents: write
  issues: read
  actions: read

jobs:
  accept005-product-continuation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ github.token }}
      EXECUTOR_GITHUB_EFFECT_TOKEN: ${{ secrets.EXECUTOR_GITHUB_EFFECT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact accepted Executor candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: 843ee131118c0c5fe1d4e6bfa2acff069829aee7
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact accepted candidate identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = '843ee131118c0c5fe1d4e6bfa2acff069829aee7'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Acquire exact ACCEPT-005 control harness
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            'https://raw.githubusercontent.com/FJ899/Executor/cdf3701bbc92094fcb97c1e158b236fca0f2cbeb/tools/run_gp001_accept005_continuation.sh' \
            -o "${RUNNER_TEMP}/run_gp001_accept005_continuation.sh"
          test -s "${RUNNER_TEMP}/run_gp001_accept005_continuation.sh"

      - name: Execute guarded ACCEPT-005 continuation
        shell: bash
        run: bash "${RUNNER_TEMP}/run_gp001_accept005_continuation.sh"

      - name: Verify sandbox cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -a --filter label=creative-os-executor-pilot=p4-bounded-real-pilot --format '{{.ID}}')"
          test -z "$remaining"

      - name: Preserve ACCEPT-005 product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-product-accept-005-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-output
            effect-evidence
            runs
          if-no-files-found: warn
          retention-days: 30
