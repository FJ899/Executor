name: Chat GP001 request 004 incomplete publication diagnostic

on:
  push:
    branches:
      - ops/chat-fresh-gp001-request-004

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download exact publisher artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9627907307
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33024628387

      - name: Print bounded publication state only
        shell: bash
        run: |
          set -euo pipefail
          root="$(find evidence -type f -name publication.json -printf '%h\n' -quit)"
          test -n "$root"
          python - "$root" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          p=json.load(open(root/'publication.json',encoding='utf-8'))
          e=p.get('publication_effect') or {}
          print('PUBLICATION_STATUS='+str(p.get('status')))
          print('EFFECT_STATUS='+str(e.get('status')))
          print('EFFECT_ACTION='+str(e.get('action_kind')))
          print('EFFECT_TARGET='+str(e.get('target')))
          print('AUTOMATIC_RETRY_ALLOWED='+str(e.get('automatic_retry_allowed')))
          print('EFFECT_OBJECT_ID='+str(e.get('object_id')))
          print('EFFECT_OBJECT_URL='+str(e.get('object_url')))
          print('OBSERVATION_REF='+str(e.get('observation_ref')))
          print('AUTHORITY_RESULT_BINDING='+json.dumps(e.get('authority_result_binding'),sort_keys=True))
          for path in sorted((root/'effect-evidence').glob('*.json')):
              v=json.load(open(path,encoding='utf-8'))
              payload=v.get('payload') if isinstance(v,dict) else None
              out={'file':path.name,'kind':v.get('kind') if isinstance(v,dict) else None}
              if isinstance(payload,dict):
                  for key in ('provider','action_kind','target','provider_outcome','provider_status','receipt_provider_status','object_id','object_url','effect_sha256','receipt_evidence_sha256'):
                      if key in payload: out[key]=payload[key]
              print('EVIDENCE='+json.dumps(out,sort_keys=True))
          stderr=root/'publication.stderr'
          if stderr.exists():
              text=stderr.read_text(encoding='utf-8',errors='replace').strip()
              print('STDERR='+text[:2000])
          PY
