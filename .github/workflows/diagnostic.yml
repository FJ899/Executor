name: No-effect reauthorization exact-head CI

on:
  push:
    branches:
      - ops/no-effect-reauth-ci

permissions:
  contents: read

jobs:
  verify-exact-candidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: e02a21dc40836f56e0302a59ae42c58c1239e7ec
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact identity
        run: test "$(git rev-parse HEAD)" = 'e02a21dc40836f56e0302a59ae42c58c1239e7ec'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile product package
        run: python -m compileall -q executor

      - name: Run retry and persistence regression tests
        run: |
          python -m unittest \
            tests.test_product_draft_pr_retry \
            tests.test_solution_artifact_bridge \
            tests.test_product_cli_serialization \
            -v

      - name: Run full unit and state suite
        run: python -m unittest discover -s tests -v
