name: GP001 draft publication retry plan zero effect

on:
  push:
    branches: [ops/gp001-current-draft-pr-005]

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          path: executor-src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --no-deps ./executor-src
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9636321620
          path: prior
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33047770719
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/executor-pilot-target
          ref: 3934a94a5eebf750079200589d6dc40e024d44a0
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Build deterministic retry plan and Human JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p retry-output
          frozen="$(find prior -type f -name frozen.json -print -quit)"
          report="$(find prior -type f -name pilot-report.json -print -quit)"
          prior_result="$(find prior -type f -name publication-result.json -print -quit)"
          patch="$(find prior -type f -name pilot.patch -print -quit)"
          test -n "$frozen" && test -n "$report" && test -n "$prior_result" && test -n "$patch"
          git -C target apply --check "../$patch"
          git -C target apply "../$patch"
          PYTHONPATH=executor-src python - "$frozen" "$report" "$prior_result" <<'PY'
          import json, sys
          from pathlib import Path
          from executor.product_draft_pr_retry import ProductDraftPrRetryExecutor
          frozen=json.load(open(sys.argv[1],encoding='utf-8'))
          report=json.load(open(sys.argv[2],encoding='utf-8'))
          prior=json.load(open(sys.argv[3],encoding='utf-8'))
          ex=ProductDraftPrRetryExecutor(frozen_result=frozen,pilot_report=report,ledger=object(),evidence_directory='retry-output/evidence')
          plan=ex.plan_retry(workspace='target',prior_publication=prior)
          push=prior['push']; req=frozen['contract']['request_evidence']
          payload={
            'schema_version':'executor-github-effect-reauthorization/1.0',
            'request':{'repository':'FJ899/Executor','issue_number':req['issue_number'],'issue_node_id':req['issue_node_id'],'body_sha256':req['body_sha256']},
            'contract_sha256':frozen['contract_sha256'],
            'pilot_run_id':report['run_id'],
            'prior_no_effect':{
              'action_kind':'CREATE_GIT_REF','target':push['target'],'effect_sha256':push['effect_sha256'],'attempt_id':push['attempt_id'],
              'result_sha256':push['authority_result_binding']['result_sha256'],'absence_evidence_sha256':push['absence_observation']['evidence_sha256']},
            'authorized_effects':{
              'push':{'action_kind':'CREATE_GIT_REF','target':plan['push']['target'],'effect_sha256':plan['push']['effect_sha256']},
              'pull_request':{'action_kind':'CREATE_PULL_REQUEST','target':plan['pull_request']['target'],'effect_sha256':plan['pull_request']['effect_sha256'],'draft':True},
              'merge':False,'deploy':False,'release':False,'tag':False},
            'decision':'REAUTHORIZE_NO_EFFECT','valid_for_seconds':3600,'nonce':'human-effect-reauth-gp001-005-01'}
          Path('retry-output/retry-plan.json').write_text(json.dumps(plan,indent=2,sort_keys=True)+'\n')
          Path('retry-output/reauthorization.json').write_text(json.dumps(payload,separators=(',',':'))+'\n')
          print('RETRY_PLAN_READY=true')
          print('PUSH_EFFECT_SHA256='+plan['push']['effect_sha256'])
          print('PR_EFFECT_SHA256='+plan['pull_request']['effect_sha256'])
          print('PREVIOUS_RESULT_SHA256='+push['authority_result_binding']['result_sha256'])
          print('ABSENCE_EVIDENCE_SHA256='+push['absence_observation']['evidence_sha256'])
          print('REAUTH_JSON='+json.dumps(payload,separators=(',',':')))
          PY
          test -z "$(git -C target status --porcelain --untracked-files=no)" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-draft-pr-retry-plan-${{ github.run_id }}
          path: retry-output
          retention-days: 30
