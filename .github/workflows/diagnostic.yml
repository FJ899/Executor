name: Chat GP001 Issue 97 consume verified ACCEPT once

on:
  push:
    branches:
      - ops/chat-fresh-gp001-request-004

permissions:
  contents: write
  issues: read
  actions: read

jobs:
  decide:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ secrets.EXECUTOR_GLOBAL_AUTHORITY_TOKEN }}
    steps:
      - name: Checkout exact verified product runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: python -m pip install --no-deps .

      - name: Download exact publisher artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9635883334
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33046601242

      - name: Fetch exact live Issue 97 read only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/FJ899/Executor/issues/97' > "${RUNNER_TEMP}/issue97.json"

      - name: Reconstruct recovered publication from durable receipt and live provider
        shell: bash
        run: |
          set -euo pipefail
          root="$(find evidence -type f -name formation.json -printf '%h\n' -quit)"
          receipt="$(find "$root/effect-evidence" -type f -name 'system_write_receipt-*.json' -print -quit)"
          attempt_result="$(find "$root/effect-evidence" -type f -name 'external_effect_attempt_result-*.json' -print -quit)"
          test -n "$root" && test -n "$receipt" && test -n "$attempt_result"
          python - "$root" "$receipt" "$attempt_result" "${RUNNER_TEMP}/issue97.json" <<'PY'
          import base64, hashlib, json, pathlib, sys
          from executor.github_effect_transaction import canonical_effect_bytes
          from executor.github_trust import canonical_json
          root=pathlib.Path(sys.argv[1]); receipt_path=pathlib.Path(sys.argv[2]); attempt_path=pathlib.Path(sys.argv[3]); issue_path=pathlib.Path(sys.argv[4])
          formation=json.load(open(root/'formation.json',encoding='utf-8'))
          incomplete=json.load(open(root/'publication.json',encoding='utf-8'))
          receipt=json.load(open(receipt_path,encoding='utf-8'))
          attempt=json.load(open(attempt_path,encoding='utf-8'))
          issue=json.load(open(issue_path,encoding='utf-8'))
          if incomplete.get('status')!='FORMATION_PUBLICATION_INCOMPLETE': raise SystemExit('unexpected original publication state')
          oe=incomplete.get('publication_effect') or {}
          if oe.get('status')!='RECOVERY_REQUIRED' or oe.get('automatic_retry_allowed') is not False: raise SystemExit('original publication not fail-closed')
          canonical=formation.get('canonical_contract_request') or {}; binding=canonical.get('formation_binding') or {}; payload=canonical.get('github_request_payload') or {}
          if payload.get('request_id')!='gp001-product-authority-e2e-005' or payload.get('expires_at')!='2026-08-27T07:38:41Z': raise SystemExit('request identity drift')
          issue_payload={'schema_version':'executor-formation-authority-issue/1.0','title':'Executor authority request: gp001-product-authority-e2e-005','body':canonical_json(payload)}
          effect_sha=hashlib.sha256(canonical_effect_bytes(issue_payload)).hexdigest()
          rp=receipt.get('payload') or {}
          expected={'provider':'GITHUB','action_kind':'CREATE_ISSUE','target':'FJ899/Executor','effect_sha256':effect_sha,'provider_outcome':'SUCCESS','provider_status':201,'object_id':'97','object_url':'https://github.com/FJ899/Executor/issues/97'}
          if receipt.get('kind')!='SYSTEM_WRITE_RECEIPT': raise SystemExit('missing durable write receipt')
          for k,v in expected.items():
              if rp.get(k)!=v: raise SystemExit(f'receipt {k} mismatch')
          digest=hashlib.sha256(receipt_path.read_bytes()).hexdigest()
          if receipt_path.stem.removeprefix('system_write_receipt-')!=digest: raise SystemExit('receipt filename hash mismatch')
          ap=attempt.get('payload') or {}
          if attempt.get('kind')!='EXTERNAL_EFFECT_ATTEMPT_RESULT_BINDING' or ap.get('receipt_evidence_sha256')!=digest or ap.get('provider_outcome')!='SUCCESS' or ap.get('receipt_provider_status')!=201 or ap.get('object_id')!='97': raise SystemExit('attempt binding mismatch')
          if issue.get('number')!=97 or issue.get('state')!='open' or issue.get('title')!=issue_payload['title'] or issue.get('body')!=issue_payload['body']: raise SystemExit('live issue mismatch')
          body_sha=hashlib.sha256(issue['body'].encode()).hexdigest(); observation_ref=f"github:issue:{issue['node_id']}:{body_sha}"
          publication={
            'schema_version':'executor-formation-publication-result/1.1','status':'AWAITING_VERIFIED_HUMAN_DECISION',
            'canonical_contract_request':canonical,'formation_binding':binding,'github_request_payload':payload,
            'request_transport_provenance':{'origin':'FORMATION_PUBLISHED_REQUEST','authority':False,'publisher':'EXECUTOR_FORMATION','provider':'GITHUB','action_kind':'CREATE_ISSUE','target':'FJ899/Executor','object_id':'97','object_url':'https://github.com/FJ899/Executor/issues/97','effect_sha256':effect_sha,'observation_ref':observation_ref,'human_decision_required':True,'recovery_class':'RECEIPT_AND_LIVE_PROVIDER_RECONCILIATION','external_write_repeated':False},
            'publication_effect':{'schema_version':'executor-github-effect-result/1.0','status':'RECOVERED_EXTERNAL_EFFECT','provider':'GITHUB','action_kind':'CREATE_ISSUE','target':'FJ899/Executor','effect_sha256':effect_sha,'attempt_id':ap.get('attempt_id'),'object_id':'97','object_url':'https://github.com/FJ899/Executor/issues/97','observation_ref':observation_ref,'automatic_retry_allowed':False,'external_write_repeated':False,'recovered_from_status':'RECOVERY_REQUIRED'},
            'manual_request_rewrite_required':False,'executable':False,
            'recovery':{'kind':'READ_ONLY_RECEIPT_AND_PROVIDER_RECONCILIATION','external_write_repeated':False,'source_run_id':33046601242,'source_artifact_id':9635883334},
          }
          pathlib.Path('publication-recovered.json').write_text(json.dumps(publication,ensure_ascii=False,indent=2),encoding='utf-8')
          print('RECOVERED_PUBLICATION_READY issue=97 external_write_repeated=false')
          PY

      - name: Consume verified Human decision and freeze exact contract
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product decide \
            --publication publication-recovered.json \
            --profile trust_profiles/github-product-gp001.json \
            --comment 5435341110 \
            --ledger "${RUNNER_TEMP}/gp001-decision-007.sqlite3" \
            > frozen.json
          python - <<'PY'
          import json
          v=json.load(open('frozen.json',encoding='utf-8'))
          if v.get('status')!='AUTHORIZED_AND_FROZEN': raise SystemExit('not frozen')
          print('DECISION_STATUS='+v['status'])
          print('CONTRACT_SHA256='+str(v.get('contract_sha256')))
          print('AUTHORITY_SOURCE='+str(v.get('authority_source')))
          PY

      - name: Preserve frozen authority evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-authorized-frozen-005-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-recovered.json
            frozen.json
          if-no-files-found: error
          retention-days: 30
