name: Chat GP001 Issue 95 receipt-first reconciliation

on:
  push:
    branches:
      - ops/chat-fresh-gp001-request-004

permissions:
  contents: read
  issues: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact verified product runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: python -m pip install --no-deps .

      - name: Download exact publisher artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9627907307
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33024628387

      - name: Fetch exact live Issue 95 read only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/FJ899/Executor/issues/95' > "${RUNNER_TEMP}/issue95.json"

      - name: Reconcile durable receipt to exact Issue 95 and derive Human binding
        shell: bash
        run: |
          set -euo pipefail
          root="$(find evidence -type f -name formation.json -printf '%h\n' -quit)"
          test -n "$root"
          receipt="$(find "$root/effect-evidence" -type f -name 'system_write_receipt-*.json' -print -quit)"
          attempt_result="$(find "$root/effect-evidence" -type f -name 'external_effect_attempt_result-*.json' -print -quit)"
          test -n "$receipt" && test -n "$attempt_result"
          python - "$root" "$receipt" "$attempt_result" "${RUNNER_TEMP}/issue95.json" <<'PY'
          import base64, hashlib, json, pathlib, sys
          from executor.github_effect_transaction import canonical_effect_bytes
          from executor.github_trust import GitHubRestClient, GitHubTrustProfile, canonical_json
          from executor.pilot_contract import build_pilot_draft_from_formation, pilot_draft_sha256
          from executor.product_github_authority import verify_formation_published_request

          root=pathlib.Path(sys.argv[1])
          receipt_path=pathlib.Path(sys.argv[2])
          attempt_result_path=pathlib.Path(sys.argv[3])
          issue_path=pathlib.Path(sys.argv[4])
          formation=json.load(open(root/'formation.json',encoding='utf-8'))
          incomplete=json.load(open(root/'publication.json',encoding='utf-8'))
          receipt=json.load(open(receipt_path,encoding='utf-8'))
          attempt_result=json.load(open(attempt_result_path,encoding='utf-8'))
          issue=json.load(open(issue_path,encoding='utf-8'))

          if incomplete.get('status')!='FORMATION_PUBLICATION_INCOMPLETE': raise SystemExit('unexpected original publication state')
          original_effect=incomplete.get('publication_effect') or {}
          if original_effect.get('status')!='RECOVERY_REQUIRED' or original_effect.get('automatic_retry_allowed') is not False: raise SystemExit('original failure is not fail-closed RECOVERY_REQUIRED')

          canonical=formation.get('canonical_contract_request') or {}
          binding=canonical.get('formation_binding') or {}
          payload=canonical.get('github_request_payload') or {}
          if payload.get('request_id')!='gp001-product-authority-e2e-004': raise SystemExit('request identity mismatch')
          if payload.get('expires_at')!='2026-08-27T00:48:20Z': raise SystemExit('request expiry mismatch')
          issue_payload={
            'schema_version':'executor-formation-authority-issue/1.0',
            'title':'Executor authority request: gp001-product-authority-e2e-004',
            'body':canonical_json(payload),
          }
          effect_sha=hashlib.sha256(canonical_effect_bytes(issue_payload)).hexdigest()
          if effect_sha!='82488853894e89803774fcc67c0a45a342563243d12373a1c4dde45f07045069': raise SystemExit('effect fingerprint mismatch')

          if receipt.get('kind')!='SYSTEM_WRITE_RECEIPT': raise SystemExit('missing durable system write receipt')
          rp=receipt.get('payload') or {}
          expected={
            'provider':'GITHUB','action_kind':'CREATE_ISSUE','target':'FJ899/Executor',
            'effect_sha256':effect_sha,'provider_outcome':'SUCCESS','provider_status':201,
            'object_id':'95','object_url':'https://github.com/FJ899/Executor/issues/95',
          }
          for k,v in expected.items():
            if rp.get(k)!=v: raise SystemExit(f'receipt {k} mismatch')
          raw=receipt_path.read_bytes(); digest=hashlib.sha256(raw).hexdigest()
          if receipt_path.stem.removeprefix('system_write_receipt-')!=digest: raise SystemExit('receipt filename hash mismatch')
          if digest!='6b129df9a30cc2fb2b20b263ccf71f91f363589ffd03b6afa33593d8982da4de': raise SystemExit('receipt digest mismatch')

          ap=attempt_result.get('payload') or {}
          if attempt_result.get('kind')!='EXTERNAL_EFFECT_ATTEMPT_RESULT_BINDING': raise SystemExit('attempt result kind mismatch')
          if ap.get('receipt_evidence_sha256')!=digest or ap.get('provider_outcome')!='SUCCESS' or ap.get('receipt_provider_status')!=201: raise SystemExit('attempt result does not bind successful receipt')
          if ap.get('object_id')!='95' or ap.get('object_url')!='https://github.com/FJ899/Executor/issues/95': raise SystemExit('attempt result object mismatch')

          response_b64=receipt.get('provider_response_b64')
          if isinstance(response_b64,str):
              response=json.loads(base64.b64decode(response_b64,validate=True).decode('utf-8'))
              if response.get('number')!=95 or response.get('title')!=issue_payload['title'] or response.get('body')!=issue_payload['body']: raise SystemExit('provider response differs from exact Issue 95')

          if issue.get('number')!=95 or issue.get('state')!='open': raise SystemExit('live Issue 95 identity/state mismatch')
          if issue.get('title')!=issue_payload['title'] or issue.get('body')!=issue_payload['body'] or issue.get('html_url')!='https://github.com/FJ899/Executor/issues/95': raise SystemExit('live Issue 95 differs from exact effect')
          body_sha=hashlib.sha256(issue['body'].encode('utf-8')).hexdigest()
          observation_ref=f"github:issue:{issue['node_id']}:{body_sha}"

          recovered_effect={
            'schema_version':'executor-github-effect-result/1.0','status':'RECOVERED_EXTERNAL_EFFECT',
            'provider':'GITHUB','action_kind':'CREATE_ISSUE','target':'FJ899/Executor',
            'effect_sha256':effect_sha,'attempt_id':ap.get('attempt_id'),'object_id':'95',
            'object_url':'https://github.com/FJ899/Executor/issues/95','observation_ref':observation_ref,
            'automatic_retry_allowed':False,'external_write_repeated':False,
            'recovered_from_status':'RECOVERY_REQUIRED',
          }
          transport={
            'origin':'FORMATION_PUBLISHED_REQUEST','authority':False,'publisher':'EXECUTOR_FORMATION',
            'provider':'GITHUB','action_kind':'CREATE_ISSUE','target':'FJ899/Executor','object_id':'95',
            'object_url':'https://github.com/FJ899/Executor/issues/95','effect_sha256':effect_sha,
            'observation_ref':observation_ref,'human_decision_required':True,
            'recovery_class':'RECEIPT_AND_LIVE_PROVIDER_RECONCILIATION','external_write_repeated':False,
          }
          publication={
            'schema_version':'executor-formation-publication-result/1.1',
            'status':'AWAITING_VERIFIED_HUMAN_DECISION',
            'canonical_contract_request':canonical,'formation_binding':binding,
            'github_request_payload':payload,'request_transport_provenance':transport,
            'publication_effect':recovered_effect,'manual_request_rewrite_required':False,'executable':False,
            'recovery':{'kind':'READ_ONLY_RECEIPT_AND_PROVIDER_RECONCILIATION','external_write_repeated':False,'source_run_id':33024628387,'source_artifact_id':9627907307},
          }
          profile=GitHubTrustProfile.from_dict(json.load(open('trust_profiles/github-product-gp001.json',encoding='utf-8')))
          request=verify_formation_published_request(GitHubRestClient(),profile=profile,issue_number=95,expected_payload=payload)
          draft=build_pilot_draft_from_formation(canonical,request,formation_publication=publication)
          summary={
            'issue_number':95,
            'issue_url':'https://github.com/FJ899/Executor/issues/95',
            'issue_node_id':issue['node_id'],
            'request_body_sha256':body_sha,
            'pilot_draft_sha256':pilot_draft_sha256(draft),
            'request_expires_at':payload['expires_at'],
            'transport_authority':False,
            'external_write_repeated':False,
          }
          print('RECOVERY_STATUS=AWAITING_VERIFIED_HUMAN_DECISION')
          print('EXTERNAL_WRITE_REPEATED=false')
          print('HUMAN_BINDING='+json.dumps(summary,sort_keys=True))
          PY
