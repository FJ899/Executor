name: Chat GP001 frozen to validated solution one-shot

on:
  push:
    branches:
      - ops/chat-fresh-gp001-request-004

permissions:
  contents: read
  actions: read

jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact verified product runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact runtime identity
        run: test "$(git rev-parse HEAD)" = 'fda645f0b8a294297f0a32782c596a29e5db0a53'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: python -m pip install --no-deps .

      - name: Download exact frozen authority artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9636044730
          path: frozen-evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33047039910

      - name: Verify exact frozen contract
        shell: bash
        run: |
          set -euo pipefail
          frozen="$(find frozen-evidence -type f -name frozen.json -print -quit)"
          test -n "$frozen"
          mkdir -p provider-output
          cp "$frozen" provider-output/frozen.json
          python - <<'PY'
          import json
          from pathlib import Path
          from executor.product_frozen_authority import validate_product_frozen_pilot_authority
          v=json.loads(Path('provider-output/frozen.json').read_text(encoding='utf-8'))
          if v.get('status')!='AUTHORIZED_AND_FROZEN': raise SystemExit('not AUTHORIZED_AND_FROZEN')
          if v.get('contract_sha256')!='a46984a72bac16c98c1c00d13a43b2664089db8eef22ce4a953d3295f1a97ce7': raise SystemExit('contract sha drift')
          if v.get('authority_source')!='VERIFIED_HUMAN_DECISION_ONLY': raise SystemExit('authority source drift')
          validate_product_frozen_pilot_authority(v)
          contract=v.get('contract') or {}; target=contract.get('target') or {}; task=contract.get('task') or {}
          if target != {'repository':'FJ899/executor-pilot-target','commit':'3934a94a5eebf750079200589d6dc40e024d44a0','tree':'26d307afcbb3ce72b2911ca44936712c11558c4c'}: raise SystemExit('target binding drift')
          if task.get('allowed_paths') != ['project_registry/registry.py']: raise SystemExit('allowed path drift')
          print('FROZEN_AUTHORITY_VALID=true')
          PY

      - name: Checkout exact bounded target source read only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/executor-pilot-target
          ref: 3934a94a5eebf750079200589d6dc40e024d44a0
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target commit tree and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = '3934a94a5eebf750079200589d6dc40e024d44a0'
          test "$(git -C target rev-parse 'HEAD^{tree}')" = '26d307afcbb3ce72b2911ca44936712c11558c4c'
          test -z "$(git -C target status --porcelain)"

      - name: Re-derive zero-effect solution through provider boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from executor.solution_provider import generate_validated_solution
          from executor.solution_artifact import runtime_solution_proposal

          frozen=json.loads(Path('provider-output/frozen.json').read_text(encoding='utf-8'))
          contract=frozen['contract']; task=contract['task']; target_binding=contract['target']
          p=Path('target/project_registry/registry.py')
          source=p.read_text(encoding='utf-8')
          old='''    def add_many(self, projects: Iterable[Project]) -> None:\n        """Add projects one by one, leaving earlier writes after a late duplicate."""\n\n        for project in projects:\n            if project.project_id in self._projects:\n                raise DuplicateProjectError(\n                    f"duplicate project_id: {project.project_id}"\n                )\n            self._projects[project.project_id] = project\n'''
          new='''    def add_many(self, projects: Iterable[Project]) -> None:\n        """Add a batch atomically after validating all project identifiers."""\n\n        batch = list(projects)\n        seen = set(self._projects)\n        for project in batch:\n            if project.project_id in seen:\n                raise DuplicateProjectError(\n                    f"duplicate project_id: {project.project_id}"\n                )\n            seen.add(project.project_id)\n        for project in batch:\n            self._projects[project.project_id] = project\n'''
          if source.count(old) != 1: raise SystemExit('pinned bounded defect block mismatch')
          replacement=source.replace(old,new,1)
          before=hashlib.sha256(source.encode('utf-8')).hexdigest()
          after=hashlib.sha256(replacement.encode('utf-8')).hexdigest()

          class Provider:
              provider_name='OPENAI_CHATGPT'
              model_name='chatgpt-session'
              def generate_candidate(self, *, frozen_contract, prompt):
                  # Provider receives only exact frozen data + prompt and has no effect handle.
                  return {
                      'schema_version':'executor-solution-candidate/1.0',
                      'status':'AWAITING_FROZEN_CONTRACT_SHA',
                      'proposal_id':'gp001-product-solution-005',
                      'repository':target_binding['repository'],
                      'source_commit':target_binding['commit'],
                      'source_tree':target_binding['tree'],
                      'mutations':[{
                          'path':'project_registry/registry.py',
                          'expected_before_sha256':before,
                          'replacement_text':replacement,
                          'expected_after_sha256':after,
                      }],
                      'rationale':'Validate the complete batch before mutating ProjectRegistry state, preserving atomicity when a duplicate appears late in the batch.',
                      'evidence_plan':[*task['postcondition_argv'], *task['regression_argv']],
                  }

          prompt='Re-derive the exact frozen GP001 bounded one-file atomic batch fix without changing protected tests.'
          validated=generate_validated_solution(
              provider=Provider(),
              frozen_result=frozen,
              prompt=prompt,
              historical_candidate_relation='SAME_FIX_REDERIVED',
          )
          artifact=validated.to_dict()
          if artifact['contract_sha256'] != 'a46984a72bac16c98c1c00d13a43b2664089db8eef22ce4a953d3295f1a97ce7': raise SystemExit('proposal contract binding drift')
          if artifact['provenance'].get('effect_capability') != 'NONE': raise SystemExit('provider gained effect capability')
          if artifact['provenance'].get('human_solution_edits') != 0: raise SystemExit('unexpected human solution edit')
          if artifact['provenance'].get('source') != {'repository':'FJ899/executor-pilot-target','commit':'3934a94a5eebf750079200589d6dc40e024d44a0','tree':'26d307afcbb3ce72b2911ca44936712c11558c4c'}: raise SystemExit('provider source provenance drift')
          runtime_solution_proposal(artifact, frozen_result=frozen)
          Path('provider-output/proposal-validated.json').write_text(json.dumps(artifact,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('VALIDATED_SOLUTION_PROPOSAL=true')
          print('PROPOSAL_ID='+artifact['proposal_id'])
          print('PAYLOAD_SHA256='+artifact['payload_sha256'])
          print('PROVENANCE_SHA256='+artifact['provenance_sha256'])
          print('PROVIDER='+artifact['provenance']['provider'])
          print('MODEL='+artifact['provenance']['model'])
          print('EFFECT_CAPABILITY='+artifact['provenance']['effect_capability'])
          print('TARGET_WRITE_PERFORMED=false')
          PY
          test -z "$(git -C target status --porcelain)"

      - name: Preserve validated provider evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-validated-solution-005-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-output
          if-no-files-found: error
          retention-days: 30
