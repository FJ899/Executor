name: Chat ACCEPT-005 exact runtime verification

on:
  push:
    branches:
      - ops/chat-accept005-fda-verification

permissions:
  contents: read
  actions: read

jobs:
  verify-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact product runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact runtime identity
        run: test "$(git rev-parse HEAD)" = 'fda645f0b8a294297f0a32782c596a29e5db0a53'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: python -m pip install --no-deps .

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Download exact frozen ACCEPT-005 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9626679416
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33021461283

      - name: Validate frozen authority and saved provider artifact read only
        shell: bash
        run: |
          set -euo pipefail
          frozen="$(find evidence -type f -name frozen.json -print -quit)"
          proposal="$(find evidence -type f -name proposal.json -print -quit)"
          test -n "$frozen" && test -n "$proposal"
          python - "$frozen" "$proposal" <<'PY'
          import json, sys
          from executor.frozen_pilot_authority import validate_frozen_pilot_authority
          from executor.solution_artifact_bridge import normalize_solution_artifact
          from executor.solution_proposal import validate_solution_proposal
          frozen=json.load(open(sys.argv[1],encoding='utf-8'))
          saved=json.load(open(sys.argv[2],encoding='utf-8'))
          if frozen.get('status')!='AUTHORIZED_AND_FROZEN': raise SystemExit('frozen status mismatch')
          if frozen.get('contract_sha256')!='e35d5cb5cdbd7c21a876e1036cbeeb7e214a2bc9856bcb882db95ccafca5af68': raise SystemExit('frozen contract sha mismatch')
          request,decision=validate_frozen_pilot_authority(frozen)
          if decision.comment_id!=5431977112 or decision.comment_node_id!='IC_kwDOTpqUf88AAAABQ8VkmA': raise SystemExit('decision identity mismatch')
          canonical=normalize_solution_artifact(saved,frozen_result=frozen)
          validated=validate_solution_proposal(canonical,frozen_result=frozen)
          if validated.payload_sha256!='f9e0b171359c5ec4d77d258b7c1737e2776f118a56153e2a00258a5e05d59ce4': raise SystemExit('proposal hash mismatch')
          print('EXACT_FROZEN_AND_PROPOSAL_VALID=true')
          print('WRITE_CAPABILITY=false')
          PY
