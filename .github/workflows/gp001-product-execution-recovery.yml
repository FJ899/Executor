name: GP001 ACCEPT-005 read-only execution inspection

on:
  push:
    branches:
      - ops/accept005-live-e2e
    paths:
      - .github/workflows/gp001-product-execution-recovery.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact failed live E2E artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9626679416
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33021461283

      - name: Inspect execution result read only
        shell: bash
        run: |
          set -euo pipefail
          echo 'WRITE_CAPABILITY=false'
          find evidence -maxdepth 5 -type f -print | sort
          report="$(find evidence -type f -name pilot-report.json -print -quit)"
          frozen="$(find evidence -type f -name frozen.json -print -quit)"
          proposal="$(find evidence -type f -name proposal.json -print -quit)"
          test -n "$report" && test -n "$frozen" && test -n "$proposal"
          echo '--- PILOT REPORT ---'
          cat "$report"
          echo '--- FROZEN SUMMARY ---'
          python - "$frozen" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          contract=value.get('contract') or {}
          decision=contract.get('decision_evidence') or {}
          print('status='+str(value.get('status')))
          print('contract_sha256='+str(value.get('contract_sha256')))
          print('decision_comment_id='+str(decision.get('comment_id')))
          print('decision='+str(decision.get('decision')))
          PY
