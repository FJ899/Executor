name: GP001 ACCEPT-005 refined recovery verification

on:
  push:
    branches:
      - ops/accept005-live-e2e
    paths:
      - .github/workflows/gp001-product-execution-recovery.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-refined-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact refined product head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact refined product identity
        shell: bash
        run: test "$(git rev-parse HEAD)" = 'fda645f0b8a294297f0a32782c596a29e5db0a53'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact refined runtime
        run: python -m pip install --no-deps .

      - name: Run full unit suite on exact refined head
        run: python -m unittest discover -s tests -v

      - name: Download exact globally-bound ACCEPT-005 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9626679416
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33021461283

      - name: Validate frozen authority and canonical provider proposal read only
        shell: bash
        run: |
          set -euo pipefail
          frozen="$(find evidence -type f -name frozen.json -print -quit)"
          proposal="$(find evidence -type f -name proposal.json -print -quit)"
          test -n "$frozen" && test -n "$proposal"
          python - "$frozen" "$proposal" <<'PY'
          import json,sys
          from executor.frozen_pilot_authority import validate_frozen_pilot_authority
          from executor.solution_proposal import validate_solution_proposal

          frozen=json.load(open(sys.argv[1],encoding='utf-8'))
          saved=json.load(open(sys.argv[2],encoding='utf-8'))
          if frozen.get('status')!='AUTHORIZED_AND_FROZEN': raise SystemExit('frozen status mismatch')
          if frozen.get('contract_sha256')!='e35d5cb5cdbd7c21a876e1036cbeeb7e214a2bc9856bcb882db95ccafca5af68': raise SystemExit('frozen contract sha mismatch')
          request,decision=validate_frozen_pilot_authority(frozen)
          if decision.decision!='ACCEPT': raise SystemExit('frozen decision is not ACCEPT')
          if decision.comment_id!=5431977112 or decision.comment_node_id!='IC_kwDOTpqUf88AAAABQ8VkmA': raise SystemExit('frozen decision identity mismatch')
          if request.issue_number!=94 or request.issue_node_id!='I_kwDOTpqUf88AAAABOaSz2w': raise SystemExit('frozen request identity mismatch')

          transport=frozen.get('request_transport_provenance') or {}
          if transport.get('origin')!='FORMATION_PUBLISHED_REQUEST' or transport.get('authority') is not False: raise SystemExit('transport authority boundary mismatch')
          if transport.get('object_id')!='94' or transport.get('object_url')!='https://github.com/FJ899/Executor/issues/94': raise SystemExit('transport object mismatch')

          consumption=frozen.get('decision_consumption') or {}
          global_binding=consumption.get('global') or {}
          expected_key='github-decision:IC_kwDOTpqUf88AAAABQ8VkmA'
          if consumption.get('authority_key')!=expected_key or global_binding.get('authority_key')!=expected_key: raise SystemExit('decision consumption key mismatch')
          if consumption.get('state')!='FINAL' or global_binding.get('state')!='FINAL': raise SystemExit('decision consumption is not final')
          if global_binding.get('provider_state')!='GLOBAL_RESULT_BOUND': raise SystemExit('global decision result is not bound')

          canonical={
            'schema_version':'executor-solution-proposal/1.0',
            'proposal_id':saved['proposal_id'],
            'contract_sha256':saved['contract_sha256'],
            'repository':saved['repository'],
            'source_commit':saved['source_commit'],
            'source_tree':saved['source_tree'],
            'mutations':saved['mutations'],
            'rationale':saved['rationale'],
            'evidence_plan':saved['evidence_plan'],
            'provenance':saved['provenance'],
          }
          validated=validate_solution_proposal(canonical,frozen_result=frozen)
          if validated.payload_sha256!='f9e0b171359c5ec4d77d258b7c1737e2776f118a56153e2a00258a5e05d59ce4': raise SystemExit('canonical proposal payload hash mismatch')
          if validated.repository!='FJ899/executor-pilot-target' or validated.source_commit!='3934a94a5eebf750079200589d6dc40e024d44a0' or validated.source_tree!='26d307afcbb3ce72b2911ca44936712c11558c4c': raise SystemExit('proposal target identity mismatch')
          print('REFINED_FROZEN_AUTHORITY_VALID=true')
          print('CONTRACT_SHA256='+frozen['contract_sha256'])
          print('CANONICAL_PROPOSAL_SHA256='+validated.payload_sha256)
          print('RECOVERY_WRITE_CAPABILITY=false')
          PY
