name: GP001 ACCEPT-005 post-effect read-only inspection

on:
  push:
    branches:
      - ops/accept005-execution-continuation
    paths:
      - .github/workflows/gp001-product-execution-recovery.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-only:
    runs-on: ubuntu-24.04
    steps:
      - name: State boundary
        run: |
          echo 'WRITE_CAPABILITY=false'
          echo 'EXECUTION_RETRY_ALLOWED=false'
          echo 'PUBLICATION_RETRY_ALLOWED=false'
          echo 'SOURCE_RUN=33021870013'
