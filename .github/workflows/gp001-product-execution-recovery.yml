name: GP001 ACCEPT-005 read-only frozen binding inspection

on:
  push:
    branches:
      - ops/accept005-live-e2e
    paths:
      - .github/workflows/gp001-product-execution-recovery.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-recovery-material:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact accepted runtime base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: 28d631cf35892b0c0df62c9f20ed2b5f7c696015
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact runtime
        run: python -m pip install --no-deps .

      - name: Download exact globally-bound freeze artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9626679416
          path: evidence
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33021461283

      - name: Inspect exact binding and canonical proposal read only
        shell: bash
        run: |
          set -euo pipefail
          frozen="$(find evidence -type f -name frozen.json -print -quit)"
          proposal="$(find evidence -type f -name proposal.json -print -quit)"
          test -n "$frozen" && test -n "$proposal"
          python - "$frozen" "$proposal" <<'PY'
          import copy,hashlib,json,sys
          from executor.github_trust import canonical_json
          from executor.frozen_pilot_authority import validate_frozen_pilot_authority
          from executor.solution_proposal import validate_solution_proposal

          frozen=json.load(open(sys.argv[1],encoding='utf-8'))
          saved=json.load(open(sys.argv[2],encoding='utf-8'))
          if frozen.get('status')!='AUTHORIZED_AND_FROZEN': raise SystemExit('frozen status mismatch')
          if frozen.get('contract_sha256')!='e35d5cb5cdbd7c21a876e1036cbeeb7e214a2bc9856bcb882db95ccafca5af68': raise SystemExit('frozen contract sha mismatch')
          _,dec=validate_frozen_pilot_authority(frozen)
          if dec.decision!='ACCEPT': raise SystemExit('frozen decision is not ACCEPT')

          binding=frozen.get('decision_consumption')
          if not isinstance(binding,dict): raise SystemExit('missing decision_consumption')
          global_binding=binding.get('global')
          if not isinstance(global_binding,dict): raise SystemExit('missing global binding')
          prebind=copy.deepcopy(frozen); prebind.pop('decision_consumption',None)
          prebind_sha=hashlib.sha256(canonical_json(prebind).encode('utf-8')).hexdigest()
          whole_sha=hashlib.sha256(canonical_json(frozen).encode('utf-8')).hexdigest()
          print('LOCAL_STATE='+str(binding.get('state')))
          print('LOCAL_RESULT_SHA256='+str(binding.get('result_sha256')))
          print('GLOBAL_STATE='+str(global_binding.get('state')))
          print('GLOBAL_PROVIDER_STATE='+str(global_binding.get('provider_state')))
          print('GLOBAL_RESULT_SHA256='+str(global_binding.get('result_sha256')))
          print('PREBIND_CANONICAL_SHA256='+prebind_sha)
          print('WHOLE_ARTIFACT_CANONICAL_SHA256='+whole_sha)
          print('DECISION_COMMENT_ID='+str((frozen['contract']['decision_evidence'])['comment_id']))
          print('DECISION_COMMENT_NODE_ID='+str((frozen['contract']['decision_evidence'])['comment_node_id']))

          canonical={
            'schema_version':'executor-solution-proposal/1.0',
            'proposal_id':saved['proposal_id'],
            'contract_sha256':saved['contract_sha256'],
            'repository':saved['repository'],
            'source_commit':saved['source_commit'],
            'source_tree':saved['source_tree'],
            'mutations':saved['mutations'],
            'rationale':saved['rationale'],
            'evidence_plan':saved['evidence_plan'],
            'provenance':saved['provenance'],
          }
          validated=validate_solution_proposal(canonical,frozen_result=frozen)
          print('CANONICAL_PROPOSAL_SHA256='+validated.payload_sha256)
          print('RECOVERY_WRITE_CAPABILITY=false')
          PY
