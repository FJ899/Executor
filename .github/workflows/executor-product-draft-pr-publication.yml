name: Executor product draft PR publication

on:
  push:
    branches:
      - ops/gp001-current-draft-pr-005

permissions:
  contents: write
  actions: read

jobs:
  publish-draft-pr:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ github.token }}
      EXECUTOR_GITHUB_EFFECT_TOKEN: ${{ secrets.EXECUTOR_GITHUB_EFFECT_TOKEN }}
    steps:
      - name: Checkout exact product runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: fda645f0b8a294297f0a32782c596a29e5db0a53
          path: executor-src
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact product runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C executor-src rev-parse HEAD)" = 'fda645f0b8a294297f0a32782c596a29e5db0a53'

      - name: Check consequential effect token presence without revealing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXECUTOR_GITHUB_EFFECT_TOKEN:-}" ]; then
            echo 'EFFECT_TOKEN_PRESENT=false'
            exit 20
          fi
          echo 'EFFECT_TOKEN_PRESENT=true'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact product runtime
        run: python -m pip install --no-deps ./executor-src

      - name: Download exact current execution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9636223917
          path: prior
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33047492859

      - name: Materialize and validate publication inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-input publication-output effect-evidence
          frozen="$(find prior -type f -name frozen.json -print -quit)"
          report="$(find prior -type f -name pilot-report.json -print -quit)"
          patch="$(find prior -type f -name pilot.patch -print -quit)"
          test -n "$frozen" && test -n "$report" && test -n "$patch"
          cp "$frozen" publication-input/frozen.json
          cp "$report" publication-input/pilot-report.json
          cp "$patch" publication-input/pilot.patch
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from executor.product_frozen_authority import validate_product_frozen_pilot_authority
          frozen=json.loads(Path('publication-input/frozen.json').read_text(encoding='utf-8'))
          report=json.loads(Path('publication-input/pilot-report.json').read_text(encoding='utf-8'))
          patch=Path('publication-input/pilot.patch').read_bytes()
          if frozen.get('status')!='AUTHORIZED_AND_FROZEN': raise SystemExit('frozen status mismatch')
          if frozen.get('contract_sha256')!='a46984a72bac16c98c1c00d13a43b2664089db8eef22ce4a953d3295f1a97ce7': raise SystemExit('contract sha mismatch')
          validate_product_frozen_pilot_authority(frozen)
          if report.get('status')!='ACTION_COMPLETED_REVIEW_REQUIRED': raise SystemExit('pilot status mismatch')
          if report.get('contract_sha256')!=frozen.get('contract_sha256'): raise SystemExit('pilot contract binding mismatch')
          if report.get('repository')!='FJ899/executor-pilot-target': raise SystemExit('repository mismatch')
          if report.get('source_commit')!='3934a94a5eebf750079200589d6dc40e024d44a0': raise SystemExit('source commit mismatch')
          if report.get('changed_paths')!=['project_registry/registry.py']: raise SystemExit('changed path mismatch')
          request=report.get('draft_pr_request') or {}
          if request.get('draft') is not True or request.get('merge_allowed') is not False: raise SystemExit('draft-only boundary mismatch')
          actual=hashlib.sha256(patch).hexdigest(); expected=(report.get('patch') or {}).get('sha256')
          if actual!=expected: raise SystemExit(f'patch sha mismatch expected={expected} actual={actual}')
          summary={'run_id':report.get('run_id'),'head_branch':request.get('head_branch'),'title':request.get('title'),'patch_sha256':actual,'decision_expires_at':((frozen.get('contract') or {}).get('decision_evidence') or {}).get('expires_at')}
          Path('publication-output/preflight-summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('RUN_ID='+str(summary['run_id']))
          print('HEAD_BRANCH='+str(summary['head_branch']))
          print('PATCH_SHA256='+actual)
          print('DECISION_EXPIRES_AT='+str(summary['decision_expires_at']))
          PY

      - name: Observe target branch and matching PR read only before any write
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          summary=json.loads(Path('publication-output/preflight-summary.json').read_text())
          branch=summary['head_branch']; token=os.environ['GITHUB_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'executor-preflight-readonly'}
          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r: return r.status,r.read()
              except urllib.error.HTTPError as e: return e.code,e.read()
          ref_url='https://api.github.com/repos/FJ899/executor-pilot-target/git/ref/heads/'+urllib.parse.quote(branch,safe='/')
          rs,rb=get(ref_url); Path('publication-output/preflight-ref.json').write_bytes(rb)
          if rs not in {200,404}: raise SystemExit(f'ref preflight incomplete HTTP {rs}')
          q=urllib.parse.urlencode({'state':'all','head':f'FJ899:{branch}','base':'main','per_page':100})
          ps,pb=get('https://api.github.com/repos/FJ899/executor-pilot-target/pulls?'+q); Path('publication-output/preflight-prs.json').write_bytes(pb)
          if ps!=200: raise SystemExit(f'PR preflight incomplete HTTP {ps}')
          prs=json.loads(pb.decode('utf-8'))
          print('PREEXISTING_REF='+str(rs==200).lower())
          print('PREEXISTING_MATCHING_PRS='+str(len(prs)))
          if rs==200 or prs: raise SystemExit('pre-existing publication object detected; reconciliation required before any write')
          PY

      - name: Checkout exact frozen target source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/executor-pilot-target
          ref: 3934a94a5eebf750079200589d6dc40e024d44a0
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Apply exact verified pilot patch locally
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = '3934a94a5eebf750079200589d6dc40e024d44a0'
          test "$(git -C target rev-parse 'HEAD^{tree}')" = '26d307afcbb3ce72b2911ca44936712c11558c4c'
          test -z "$(git -C target status --porcelain)"
          git -C target apply --check ../publication-input/pilot.patch
          git -C target apply ../publication-input/pilot.patch
          mapfile -t changed < <(git -C target diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'project_registry/registry.py'
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          report=json.loads(Path('publication-input/pilot-report.json').read_text())
          patch=subprocess.run(['git','-C','target','diff','--no-ext-diff','--no-textconv','--binary','3934a94a5eebf750079200589d6dc40e024d44a0'],capture_output=True,text=True,check=True).stdout.encode()
          actual=hashlib.sha256(patch).hexdigest(); expected=(report.get('patch') or {}).get('sha256')
          if actual!=expected: raise SystemExit(f'applied patch drift expected={expected} actual={actual}')
          print('APPLIED_PATCH_SHA256='+actual)
          PY

      - name: Publish bounded draft PR exactly once through product effect lifecycle
        id: publish
        shell: bash
        run: |
          set -uo pipefail
          set +e
          creative-os-product publish-draft-pr \
            --frozen publication-input/frozen.json \
            --pilot-report publication-input/pilot-report.json \
            --profile executor-src/trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/publication-authority.sqlite3" \
            --evidence-dir effect-evidence \
            --workspace target \
            > publication-output/publication-result.json 2> publication-output/publication.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > publication-output/publication-exit-code.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "PUBLISH_EXIT_CODE=$rc"
          if [ -s publication-output/publication-result.json ]; then cat publication-output/publication-result.json; fi
          # Never retry here. Any nonzero exit may be post-write.
          exit 0

      - name: Preserve publication result and effect evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-current-draft-pr-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-input
            publication-output
            effect-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Fail closed if publication did not return cleanly
        if: steps.publish.outputs.exit_code != '0'
        run: |
          echo 'Publication did not return cleanly; reconcile receipts/provider state. NO RETRY.'
          exit 1

      - name: Assert final draft-only product state
        if: steps.publish.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('publication-output/publication-result.json').read_text())
          if v.get('status')!='DRAFT_PR_CREATED_REVIEW_REQUIRED': raise SystemExit('unexpected final publication status')
          if v.get('human_review_required') is not True or v.get('human_acceptance')!='PENDING': raise SystemExit('review state mismatch')
          for key in ('merge_allowed','deploy_allowed','release_allowed','tag_allowed'):
              if v.get(key) is not False: raise SystemExit(f'{key} widened')
          pr=v.get('pull_request') or {}
          print('FINAL_STATUS='+v['status'])
          print('DRAFT_PR_URL='+str(pr.get('object_url')))
          print('DRAFT_PR_NUMBER='+str(pr.get('object_id')))
          print('PUBLISHED_COMMIT='+str((v.get('prepared') or {}).get('commit_sha')))
          print('PUBLISHED_TREE='+str((v.get('prepared') or {}).get('tree_sha')))
          print('HEAD_BRANCH='+str((v.get('prepared') or {}).get('head_branch')))
          print('HUMAN_ACCEPTANCE=PENDING')
          print('MERGE_ALLOWED=false')
          PY
