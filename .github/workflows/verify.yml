name: Verify Executor foundations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile package
        run: python -m compileall -q executor

      - name: Run unit and state tests
        run: python -m unittest discover -s tests -v

      - name: Validate authoritative project bundle
        run: python -m executor.cli validate-project project_contracts/executor-self.yaml --policy EXECUTOR_POLICY.yaml --base-dir .

      - name: Validate locked task fixture
        run: python -m executor.cli validate-task tasks/examples/EXECUTOR_TASK_FIXTURE-001.yaml --policy EXECUTOR_POLICY.yaml --base-dir . --repository-root JTJ07/Executor=.

      - name: Prove GINSENG placeholder task is blocked
        run: |
          set +e
          output=$(python -m executor.cli validate-task tasks/examples/GINSENG_TEST-003.yaml --policy EXECUTOR_POLICY.yaml --base-dir .)
          code=$?
          test "$code" -eq 2
          printf '%s' "$output" | grep UNLOCKED_REPOSITORY
          printf '%s' "$output" | grep UNLOCKED_TEST_CONTRACT

      - name: Prove traversal path is blocked
        run: |
          set +e
          output=$(python -m executor.cli policy-check project_contracts/executor-self.yaml --policy EXECUTOR_POLICY.yaml --base-dir . --path executor/../EXECUTOR_POLICY.yaml --allowed 'executor/**' --repository-root .)
          code=$?
          test "$code" -eq 2
          printf '%s' "$output" | grep HARD_VETO

      - name: Prove Executor CLI is allowed by its command policy
        run: python -m executor.cli policy-check project_contracts/executor-self.yaml --policy EXECUTOR_POLICY.yaml --base-dir . --command-line 'python -m executor.cli validate-project project_contracts/executor-self.yaml'

      - name: Read untrusted repository data through wrapper
        run: |
          output=$(python -m executor.cli repository-read --project project_contracts/executor-self.yaml --policy EXECUTOR_POLICY.yaml --base-dir . --repository JTJ07/Executor --commit "$GITHUB_SHA" --root . --path tests/fixtures/untrusted_prompt.md)
          printf '%s' "$output" | grep '"trust": "untrusted_data"'
          printf '%s' "$output" | grep '"can_instruct_executor": false'

      - name: Validate example test contract
        run: python -m executor.cli validate-test test_contracts/examples/valid_test.yaml --base-dir tests/fixtures --holdout-evidence tests/fixtures/holdout_evidence.json

      - name: Prove missing holdout evidence blocks readiness
        run: |
          set +e
          output=$(python -m executor.cli validate-test test_contracts/examples/valid_test.yaml --base-dir tests/fixtures)
          code=$?
          test "$code" -eq 2
          printf '%s' "$output" | grep HOLDOUT_VISIBILITY_UNVERIFIED

      - name: Prove invalid test is blocked before model
        run: |
          set +e
          python -m executor.cli validate-test test_contracts/examples/invalid_missing_negative.yaml --base-dir tests/fixtures
          code=$?
          test "$code" -eq 2

  sandbox-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull isolated fixture image
        run: docker pull python:3.11-slim-bookworm

      - name: Resolve exact image id
        run: echo "EXECUTOR_SANDBOX_IMAGE=$(docker image inspect --format='{{.Id}}' python:3.11-slim-bookworm)" >> "$GITHUB_ENV"

      - name: Run Docker sandbox security tests
        env:
          RUN_DOCKER_TESTS: "1"
          HOST_EXECUTOR_SECRET: "must-not-reach-container"
        run: python -m unittest tests.test_sandbox_integration -v

      - name: Verify container cleanup
        run: test -z "$(docker ps -aq --filter label=creative-os-executor-test=true)"
