name: PR32 exact pinned-refspec correction and replay

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-replay:
    if: ${{ github.event.pull_request.number == 37 && github.head_ref == 'agent/pr32-ledger-fix-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR32 reviewed head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: litrgratis-pixel/Executor
          ref: agent/manual-exact-ref-verification
          fetch-depth: 2
          persist-credentials: true

      - name: Correct exact pinned fetch refspec verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0414afb49395913d6d6dfaccb50376e57fee2776"
          python - <<'PY'
          from pathlib import Path

          verifier_path = Path('tools/p1_verifier/verify_candidate.py')
          verifier = verifier_path.read_text(encoding='utf-8')

          helper_marker = '''def verify(
          '''
          helper = '''def _extract_pinned_fetch_commit(command: Sequence[str]) -> str | None:
              commits: list[str] = []
              for item in command:
                  match = re.fullmatch(r"\\+([0-9a-f]{40}):refs/executor/input", str(item))
                  if match:
                      commits.append(match.group(1))
              return commits[0] if len(commits) == 1 else None


          def verify(
          '''
          if verifier.count(helper_marker) != 1:
              raise SystemExit('verifier helper insertion marker mismatch')
          verifier = verifier.replace(helper_marker, helper, 1)

          old = '''        commit_args = [item for item in command if SHA1_RE.fullmatch(item)]
                  if len(commit_args) != 1:
                      errors.append("network-enabled acquisition command does not bind exactly one full commit")
                  else:
                      observed_commits.append(commit_args[0])
          '''
          new = '''        observed_commit = _extract_pinned_fetch_commit(command)
                  if observed_commit is None:
                      errors.append("network-enabled acquisition command does not bind exactly one pinned fetch refspec")
                  else:
                      observed_commits.append(observed_commit)
          '''
          if verifier.count(old) != 1:
              raise SystemExit('verifier refspec block mismatch')
          verifier = verifier.replace(old, new, 1)
          verifier_path.write_text(verifier, encoding='utf-8')

          tests_path = Path('tests/test_p1_verifier.py')
          tests = tests_path.read_text(encoding='utf-8')
          marker = '''    def test_version_only_broker_ledger_cannot_preserve_authoritative_pass(self):
          '''
          test = '''    def test_authoritative_verifier_requires_exact_pinned_fetch_refspec(self):
              verifier_path = ROOT / "tools/p1_verifier/verify_candidate.py"
              spec = importlib.util.spec_from_file_location(
                  "p1_authoritative_refspec_test", verifier_path
              )
              self.assertIsNotNone(spec)
              self.assertIsNotNone(spec.loader if spec else None)
              assert spec is not None and spec.loader is not None
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              try:
                  spec.loader.exec_module(module)
                  commit = "1" * 40
                  self.assertEqual(
                      module._extract_pinned_fetch_commit(
                          ["fetch", f"+{commit}:refs/executor/input"]
                      ),
                      commit,
                  )
                  self.assertIsNone(module._extract_pinned_fetch_commit(["fetch", commit]))
                  self.assertIsNone(
                      module._extract_pinned_fetch_commit(
                          ["fetch", f"+{commit}:refs/heads/main"]
                      )
                  )
                  self.assertIsNone(
                      module._extract_pinned_fetch_commit(
                          [
                              "fetch",
                              f"+{commit}:refs/executor/input",
                              f"+{commit}:refs/executor/input",
                          ]
                      )
                  )
              finally:
                  sys.modules.pop(spec.name, None)

          ''' + marker
          if tests.count(marker) != 1:
              raise SystemExit('test insertion marker mismatch')
          tests = tests.replace(marker, test, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

      - name: Replay exact security contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | LC_ALL=C sort)" = $'tests/test_p1_verifier.py\ntools/p1_verifier/verify_candidate.py'
          git diff --check
          python -m compileall -q tools/p1_verifier tests/test_p1_verifier.py
          python -m unittest tests.test_p1_verifier -v
          python -m unittest discover -s tests -v

      - name: Commit exact correction to PR32
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_p1_verifier.py tools/p1_verifier/verify_candidate.py
          git commit -m "Verify exact pinned acquisition refspec"
          git push origin HEAD:agent/manual-exact-ref-verification
