name: PR32 independent replay v3

on:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    if: ${{ github.event.pull_request.number == 37 && github.head_ref == 'agent/pr32-ledger-fix-trigger' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR32 reviewed tree
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: litrgratis-pixel/Executor
          ref: e54ebdc44c60f76d95b844d0811c009e8916ba44
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact immutable identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e54ebdc44c60f76d95b844d0811c009e8916ba44"
          test "$(git rev-parse HEAD^)" = "6108683578c47a4547f1460ef48ed4f21405bfbb"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Replay complete regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .
          python -m unittest tests.test_p1_verifier -v
          python -m unittest discover -s tests -v

      - name: Independently verify P1-005 boundary, refspec and volume
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "authoritative_verifier", Path("tools/p1_verifier/verify_candidate.py")
          )
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)

          manifest = json.loads(
              Path("tools/p1_verifier/acceptance_manifest.json").read_text(encoding="utf-8")
          )
          expected_rule = (
              "Acquisition is trusted only when the state required for later verification "
              "cannot be modified by the candidate; use of the correct source alone is insufficient."
          )
          assert manifest["acquisition_trust_boundary_rule"] == expected_rule

          commit = "1" * 40
          assert module._extract_pinned_fetch_commit(
              ["fetch", f"+{commit}:refs/executor/input"]
          ) == commit
          assert module._extract_pinned_fetch_commit(["fetch", commit]) is None
          assert module._extract_pinned_fetch_commit(
              ["fetch", f"+{commit}:refs/heads/main"]
          ) is None
          assert module._extract_pinned_fetch_commit(
              ["fetch", f"+{commit[:12]}:refs/executor/input"]
          ) is None
          assert module._extract_pinned_fetch_commit([
              "fetch",
              f"+{commit}:refs/executor/input",
              f"+{commit}:refs/executor/input",
          ]) is None

          git_image = manifest["network_acquisition_image"]
          pattern = manifest["trusted_broker_volume_name_pattern"]
          valid = {
              "Type": "volume",
              "Name": "p1-acq-" + "a" * 24,
              "Source": "/rootless/docker/volumes/internal/_data",
              "Destination": "/trusted",
              "RW": True,
          }
          assert module._trusted_nested_mount_allowed(
              valid,
              allowed_bind_sources=manifest["allowed_nested_mount_sources"],
              trusted_volume_pattern=pattern,
              image_ref=git_image,
              acquisition_image=git_image,
          )
          assert not module._trusted_nested_mount_allowed(
              dict(valid, Name="candidate-volume"),
              allowed_bind_sources=manifest["allowed_nested_mount_sources"],
              trusted_volume_pattern=pattern,
              image_ref=git_image,
              acquisition_image=git_image,
          )
          print("P1-005 INDEPENDENT REPLAY: PASS")
          PY

      - name: Independently reject supplementary root authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tests import test_p1_verifier as broker

          image = "sha256:" + "2" * 64
          argv = [
              "create", "--name", "cos-executor-adversarial",
              "--network", "none", "--read-only",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "16", "--memory", "64m", "--cpus", "1.0",
              "--user", "65534:65534", "--group-add", "0",
              "--env", "HOME=/nonexistent", "--workdir", "/source",
              "--mount",
              "type=bind,src=/candidate/case-001/tests/fixtures/sandbox,dst=/source,readonly",
              "--tmpfs", "/workspace:rw,nosuid,nodev,size=8m,mode=1777",
              "--tmpfs", "/tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777",
              image, "python", "/source/sandbox_fixture.py", "read_source",
          ]
          allowed, command_class, reason = broker.classify_broker_argv(
              argv,
              git_image="git-image",
              sandbox_image_id=image,
              canonical_url=broker.CANONICAL_URL,
              created=set(),
          )
          assert allowed is False, (allowed, command_class, reason)
          print("P1-001 INDEPENDENT REPLAY: PASS")
          PY

      - name: Independently require successful CASE responses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from tests import test_p1_verifier as broker

          sandbox_id = "sha256:" + "2" * 64
          events = []
          sequence = 0

          def pair(request_id, argv, command_class, case_id):
              global sequence
              argv_hash = broker._sha256_bytes(broker._canonical_bytes(argv))
              sequence += 1
              events.append({
                  "sequence": sequence,
                  "phase": "request",
                  "request_id": request_id,
                  "argv": argv,
                  "argv_sha256": argv_hash,
                  "decision": "ALLOW",
                  "command_class": command_class,
                  "reason": "",
                  "case_id": case_id,
              })
              sequence += 1
              events.append({
                  "sequence": sequence,
                  "phase": "response",
                  "request_id": request_id,
                  "request_argv_sha256": argv_hash,
                  "returncode": 125,
                  "stdout_sha256": broker._sha256_text(""),
                  "stderr_sha256": broker._sha256_text("failed"),
                  "duration_seconds": 0.01,
                  "inspection": None,
                  "inspection_sha256": None,
              })

          suite = broker.AdversarialReplayRegressionTests()
          for case_id in ("001", "002", "003"):
              pair(
                  f"acquisition-{case_id}",
                  suite._network_argv(case_id),
                  "broker-owned-acquisition",
                  case_id,
              )
              pair(
                  f"sandbox-{case_id}",
                  suite._sandbox_argv(case_id),
                  "create-sandbox",
                  case_id,
              )

          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              broker._write_json(root / "docker-command-ledger.json", {
                  "schema_version": 1,
                  "broker_authority": broker.BROKER_AUTHORITY,
                  "ready_before_candidate": True,
                  "complete": True,
                  "overflow": False,
                  "broker_error": None,
                  "candidate_endpoint": broker.BROKER_ENDPOINT,
                  "direct_daemon_endpoint_exposed": False,
                  "events": events,
              })
              broker._write_json(root / "approved-nested-images.json", {
                  "images": {broker.SANDBOX_IMAGE_REF: {"id": sandbox_id}},
              })
              gate_path = root / "authoritative-final-gate.json"
              broker._write_json(gate_path, {
                  "schema_version": 2,
                  "authoritative_result": "PASS",
                  "errors": [],
                  "warnings": [],
              })
              gate = broker.apply_broker_gate(
                  execution_dir=root,
                  gate_path=gate_path,
                  output_path=root / "broker-verification.json",
              )
              assert gate["authoritative_result"] == "FAIL", gate
              assert any("returncode" in item.lower() for item in gate["errors"])
              print("P1-006 INDEPENDENT REPLAY: PASS")
          PY
