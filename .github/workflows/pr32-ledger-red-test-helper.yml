name: PR32 trusted ledger fix generator

on:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  generate:
    if: ${{ github.head_ref == 'agent/pr32-ledger-red-test-helper' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact red baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: litrgratis-pixel/Executor
          ref: bf6a4d963183422a7ab3051cc2dbc1ed2ad5d959
          fetch-depth: 1
          persist-credentials: false

      - name: Generate four-file trusted ledger fix
        shell: bash
        env:
          PATCH_B64: ''' + GIT_IMAGE + '''IiwKICAgICAgICAgICAgICAgICI''' + SANDBOX_IMAGE + '''IiwKICAgICAgICAgICAgXSwKICAgICAgICAgICAgIm5ldHdvcmtfZW5hYmxlZF9uZXN0ZWRfaW1hZ2UiOiAi''' + GIT_IMAGE + ''' '''
source = source.replace(collect_anchor, ledger_collect)
cleanup_anchor = '''          docker rm -f "$DIND_CONTAINER" >/dev/null 2>&1 || true
'''
if source.count(cleanup_anchor) != 1:
    raise SystemExit('workflow cleanup anchor mismatch')
source = source.replace(cleanup_anchor, '''          docker rm -f "$P1_LEDGER_MONITOR" >/dev/null 2>&1 || true
''' + cleanup_anchor)
workflow.write_text(source, encoding='utf-8')

changed = [
    '.github/workflows/manual-exact-ref-verify.yml',
    'tools/p1_verifier/verify_candidate.py',
    'tools/p1_verifier/acceptance_manifest.json',
    'tests/test_p1_verifier.py',
]
Path('/tmp/changed.txt').write_text('\n'.join(changed) + '\n')
