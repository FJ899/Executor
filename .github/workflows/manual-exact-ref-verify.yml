name: Manual exact-ref verification

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact authorized branch to verify
        required: true
        type: string
      expected_sha:
        description: Expected lowercase 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  exact-ref-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REF: ${{ inputs.target_ref }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      AUTHORIZED_REF: agent/pilot-runtime-replacement
      ADR_SHA: bf18638caeb1a01cd2e14e625d72a20893a04bb3
      EVIDENCE: ${{ runner.temp }}/exact-ref-evidence
      RUNS_ROOT: ${{ runner.temp }}/exact-ref-runs
      ARCHIVE_NAME: manual-exact-ref-${{ github.run_id }}-${{ github.run_attempt }}
      ACTIONLINT_VERSION: 1.7.12
      GIT_IMAGE: alpine/git@sha256:0448d24b454392f9d115c6784343899e9d35a32de0ddc39a745263db34df94dd
      SANDBOX_IMAGE: python@sha256:b18992999dbe963a45a8a4da40ac2b1975be1a776d939d098c647482bcad5cba
    steps:
      - name: Validate dispatch and prepare evidence
        shell: bash
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/logs" "$EVIDENCE/traces" "$RUNS_ROOT"
          {
            printf 'event=%s\nevent_sha=%s\nevent_ref=%s\n' "${{ github.event_name }}" "${{ github.sha }}" "${{ github.ref }}"
            printf 'workflow_ref=%s\nworkflow_sha=%s\n' "$WORKFLOW_REF" "$WORKFLOW_SHA"
            printf 'target_ref=%s\nexpected_sha=%s\n' "$TARGET_REF" "$EXPECTED_SHA"
            printf 'run_id=%s\nrun_attempt=%s\n' "${{ github.run_id }}" "${{ github.run_attempt }}"
            printf '%s\n' 'checkout_sha=34e114876b0b11c390a56381ad16ebd13914f8d5' 'setup_python_sha=a26af69be951a213d495a4c3e4e4022e16d87065' 'upload_artifact_sha=4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1'
          } | tee "$EVIDENCE/event-metadata.txt"
          test "$TARGET_REF" = "$AUTHORIZED_REF" || { echo wrong-target-ref | tee "$EVIDENCE/input-error.txt"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo malformed-expected-sha | tee "$EVIDENCE/input-error.txt"; exit 1; }
          echo PASS > "$EVIDENCE/input-validation.txt"

      - name: Checkout controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: controller

      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Bind controller, candidate and scope
        shell: bash
        run: |
          set -euo pipefail
          extract_blob() {
            local repo=$1 sha=$2 path=$3 output=$4 identity=$5 entry mode type blob tree_path
            entry="$(git -C "$repo" ls-tree "$sha" -- "$path")"
            read -r mode type blob tree_path <<<"$entry"
            test "$mode" = 100644; test "$type" = blob; test "$tree_path" = "$path"
            git -C "$repo" show "$sha:$path" > "$output"
            test "$(git hash-object "$output")" = "$blob"
            { printf 'sha=%s\nblob=%s\n' "$sha" "$blob"; sha256sum "$output"; } > "$identity"
          }
          controller_sha="$(git -C controller rev-parse HEAD)"
          test "$controller_sha" = "${{ github.workflow_sha }}"
          extract_blob controller "$controller_sha" .github/workflows/manual-exact-ref-verify.yml "$EVIDENCE/controller.yml" "$EVIDENCE/controller-identity.txt"
          actual_sha="$(git -C candidate rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          printf 'ACTUAL_SHA=%s\n' "$actual_sha" >> "$GITHUB_ENV"
          git -C candidate show -s --format=full "$actual_sha" | tee "$EVIDENCE/commit.txt"
          extract_blob candidate "$actual_sha" .github/workflows/verify.yml "$EVIDENCE/candidate-verify.yml" "$EVIDENCE/candidate-workflow-identity.txt"
          test "$(git -C candidate rev-parse "$actual_sha^")" = "$ADR_SHA"
          printf '%s\n' \
            .github/workflows/verify.yml executor/pilot_cli.py executor/pilot_core.py executor/source_acquisition.py \
            tests/test_pilot_case_001.py tests/test_pilot_case_001_integration.py \
            tests/test_pilot_case_002.py tests/test_pilot_case_002_integration.py \
            tests/test_pilot_case_003.py tests/test_pilot_case_003_integration.py \
            tests/test_pilot_cli.py tests/test_pilot_git_isolation.py tests/test_pilot_source_acquisition.py \
            > "$EVIDENCE/expected-paths.txt"
          git -C candidate diff --name-only --diff-filter=ACDMRTUXB "$ADR_SHA" "$actual_sha" | LC_ALL=C sort > "$EVIDENCE/actual-paths.txt"
          diff -u "$EVIDENCE/expected-paths.txt" "$EVIDENCE/actual-paths.txt" | tee "$EVIDENCE/logs/scope-diff.log"
          echo PASS > "$EVIDENCE/rework-scope-compliance.txt"

      - name: Verify actionlint and lint both workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/actionlint-$ACTIONLINT_VERSION"; mkdir -p "$d"
          a="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fL --proto '=https' --tlsv1.2 -o "$d/$a" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$a"
          gh release verify-asset "v$ACTIONLINT_VERSION" "$d/$a" --repo rhysd/actionlint --format json | tee "$EVIDENCE/actionlint-attestation.json"
          tar -xzf "$d/$a" -C "$d" actionlint
          sha256sum "$d/$a" "$d/actionlint" > "$EVIDENCE/actionlint-sha256.txt"
          "$d/actionlint" -version | tee "$EVIDENCE/actionlint-version.txt"
          { "$d/actionlint" "$EVIDENCE/controller.yml" "$EVIDENCE/candidate-verify.yml"; echo 'ACTIONLINT: PASS'; } 2>&1 | tee "$EVIDENCE/logs/actionlint.log"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Execute exact verification
        working-directory: candidate
        shell: bash
        env:
          RUN_DOCKER_TESTS: '1'
          PILOT_RUNS_ROOT: ${{ env.RUNS_ROOT }}
        run: |
          set -euo pipefail
          CLEAN=(env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STEP_SUMMARY -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_RUNTIME_TOKEN -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL -u ACTIONS_CACHE_URL -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u EVIDENCE)
          reject_skip() { ! grep -Eqi 'skipped|FAILED|ERROR' "$1"; grep -Eq '^OK( \(.*\))?$' "$1"; }
          { python --version; git --version; docker version; } 2>&1 | tee "$EVIDENCE/tool-versions.txt"
          command -v strace >/dev/null || { sudo apt-get update; sudo apt-get install -y --no-install-recommends strace; }
          strace --version 2>&1 | tee "$EVIDENCE/strace-version.txt"
          docker pull --platform linux/amd64 "$SANDBOX_IMAGE" |& tee "$EVIDENCE/logs/pull-sandbox.log"
          s="$(docker image inspect --format '{{json .RepoDigests}}|{{.Os}}/{{.Architecture}}|{{.Id}}' "$SANDBOX_IMAGE")"
          echo "$s" | tee "$EVIDENCE/sandbox-image.txt"; echo "$s" | grep -F "$SANDBOX_IMAGE"; test "$(cut -d'|' -f2 <<<"$s")" = linux/amd64
          export EXECUTOR_SANDBOX_IMAGE="$(cut -d'|' -f3 <<<"$s")"
          docker pull --platform linux/amd64 "$GIT_IMAGE" |& tee "$EVIDENCE/logs/pull-git.log"
          g="$(docker image inspect --format '{{json .RepoDigests}}|{{.Os}}/{{.Architecture}}|{{.Id}}' "$GIT_IMAGE")"
          echo "$g" | tee "$EVIDENCE/git-image.txt"; echo "$g" | grep -F "$GIT_IMAGE"; test "$(cut -d'|' -f2 <<<"$g")" = linux/amd64
          docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/busybox "$GIT_IMAGE" env -i PATH=/usr/bin:/bin /usr/bin/git --version | tee "$EVIDENCE/git-version.txt" | grep -Fx 'git version 2.54.0'
          "${CLEAN[@]}" python -m compileall -q executor tests |& tee "$EVIDENCE/logs/compileall.log"
          "${CLEAN[@]}" python -m unittest discover -s tests -v |& tee "$EVIDENCE/logs/unit-tests.log"
          "${CLEAN[@]}" python -m executor.cli validate-project project_contracts/executor-self.yaml --policy EXECUTOR_POLICY.yaml --base-dir . |& tee "$EVIDENCE/logs/validate-project.log"
          "${CLEAN[@]}" python -m executor.cli validate-task tasks/examples/EXECUTOR_TASK_FIXTURE-001.yaml --policy EXECUTOR_POLICY.yaml --base-dir . --repository-root litrgratis-pixel/Executor=. |& tee "$EVIDENCE/logs/validate-task.log"
          "${CLEAN[@]}" python -m executor.cli validate-test test_contracts/examples/valid_test.yaml --base-dir tests/fixtures --holdout-evidence tests/fixtures/holdout_evidence.json |& tee "$EVIDENCE/logs/validate-test.log"
          set +e
          out="$("${CLEAN[@]}" python -m executor.cli validate-task tasks/examples/GINSENG_TEST-003.yaml --policy EXECUTOR_POLICY.yaml --base-dir .)"; rc=$?; set -e
          test "$rc" -eq 2; grep -F UNLOCKED_REPOSITORY <<<"$out"; grep -F UNLOCKED_TEST_CONTRACT <<<"$out"
          "${CLEAN[@]}" python -m unittest tests.test_sandbox_integration -v |& tee "$EVIDENCE/logs/sandbox.log"
          reject_skip "$EVIDENCE/logs/sandbox.log"; grep -F 'Ran 10 tests' "$EVIDENCE/logs/sandbox.log"
          strace -ff -s 4096 -e trace=execve -o "$EVIDENCE/traces/acquisition" "${CLEAN[@]}" env RUN_PILOT_SOURCE_ACQUISITION=1 python -m unittest tests.test_pilot_source_acquisition.RealPinnedAcquisitionIntegrationTests -v |& tee "$EVIDENCE/logs/acquisition.log"
          reject_skip "$EVIDENCE/logs/acquisition.log"; find "$EVIDENCE/traces" -name 'acquisition.*' -type f -size +0c | grep -q .
          for n in 001 002 003; do
            strace -ff -s 4096 -e trace=execve -o "$EVIDENCE/traces/case-$n" "${CLEAN[@]}" env "RUN_PILOT_CASE_$n=1" EXECUTOR_COMMIT="$ACTUAL_SHA" EXECUTOR_SANDBOX_IMAGE="$EXECUTOR_SANDBOX_IMAGE" PILOT_RUNS_ROOT="$RUNS_ROOT" python -m unittest "tests.test_pilot_case_${n}_integration" -v |& tee "$EVIDENCE/logs/case-$n.log"
            reject_skip "$EVIDENCE/logs/case-$n.log"; find "$EVIDENCE/traces" -name "case-$n.*" -type f -size +0c | grep -q .
          done
          test -s "$RUNS_ROOT/source-acquisition/real-case-001/evidence/source_acquisition.json"
          test -s "$RUNS_ROOT/source-acquisition/real-case-001/evidence/source_manifest.json"
          test "$(git rev-parse HEAD)" = "$ACTUAL_SHA"; test -z "$(git status --porcelain --untracked-files=all)"; git fsck --strict |& tee "$EVIDENCE/logs/git-fsck.log"
          git show "$ACTUAL_SHA:.github/workflows/verify.yml" | cmp - "$EVIDENCE/candidate-verify.yml"
          test "$(git -C ../controller rev-parse HEAD)" = "${{ github.workflow_sha }}"; test -z "$(git -C ../controller status --porcelain --untracked-files=all)"
          git -C ../controller show "${{ github.workflow_sha }}:.github/workflows/manual-exact-ref-verify.yml" | cmp - "$EVIDENCE/controller.yml"
          python - "$RUNS_ROOT" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); found=set(); bad=[]
          for p in root.rglob('*.json'):
              try: d=json.loads(p.read_text())
              except Exception: continue
              if not isinstance(d,dict): continue
              if d.get('status')=='PASS': bad.append(str(p))
              if d.get('status')=='ACTION_COMPLETED_REVIEW_REQUIRED':
                  for c in ('001','002','003'):
                      if f'case-{c}' in str(p): found.add(c)
                  if d.get('source_acquisition',{}).get('input_model')!='CONTROLLED_HTTPS_FETCH_V1': raise SystemExit(f'bad input model: {p}')
          if bad or found!={'001','002','003'}: raise SystemExit(f'bad results: pass={bad}, found={found}')
          PY
          required=(event-metadata.txt input-validation.txt controller.yml controller-identity.txt candidate-verify.yml candidate-workflow-identity.txt expected-paths.txt actual-paths.txt rework-scope-compliance.txt actionlint-attestation.json actionlint-sha256.txt actionlint-version.txt tool-versions.txt strace-version.txt sandbox-image.txt git-image.txt git-version.txt logs/actionlint.log logs/unit-tests.log logs/sandbox.log logs/acquisition.log logs/case-001.log logs/case-002.log logs/case-003.log logs/git-fsck.log)
          for f in "${required[@]}"; do test -s "$EVIDENCE/$f"; done
          printf '%s\n' 'CHECKED OUT SHA: '"$ACTUAL_SHA" 'REWORK SCOPE COMPLIANCE: PASS' 'REAL HTTPS ACQUISITION: PASS' 'CASE-001: PASS' 'CASE-002: PASS' 'CASE-003: PASS' 'TERMINAL PASS STATUS: ABSENT' | tee "$EVIDENCE/success-gate.txt"

      - name: Verify cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -a --no-trunc | tee "$EVIDENCE/logs/cleanup.log"
          for f in 'creative-os-executor-test=true' 'creative-os-executor-pilot=case-001' 'creative-os-executor-pilot=case-002' 'creative-os-executor-pilot=case-003' 'creative-os-executor-source-git=true'; do test -z "$(docker ps -aq --filter label=$f)"; done

      - name: Build evidence archive
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE/runs"; test ! -d "$RUNS_ROOT" || cp -a "$RUNS_ROOT/." "$EVIDENCE/runs/"
          printf 'job_status=%s\n' "$JOB_STATUS" > "$EVIDENCE/job-status.txt"
          (cd "$EVIDENCE"; find . -type f ! -name file-sha256.txt -print0 | sort -z | xargs -0 sha256sum) > "$EVIDENCE/file-sha256.txt"
          a="$RUNNER_TEMP/$ARCHIVE_NAME.tar.gz"; tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C "$EVIDENCE" . | gzip -n > "$a"
          gzip -t "$a"; sha256sum "$a" > "$a.sha256"; test -s "$a"; test -s "$a.sha256"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.ARCHIVE_NAME }}.tar.gz
            ${{ runner.temp }}/${{ env.ARCHIVE_NAME }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
