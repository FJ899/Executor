name: PR32 adversarial red-test materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-red-tests:
    if: ${{ github.head_ref == 'agent/pr32-adversarial-red-generator' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact reviewed baseline
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: 62a25e2c1f38f7986f484e78e50cc7e322ebf808
          fetch-depth: 1
          persist-credentials: true

      - name: Add adversarial tests only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_p1_verifier.py')
          source = path.read_text(encoding='utf-8')
          anchor = '\n\ndef main(argv: list[str] | None = None) -> int:\n'
          if source.count(anchor) != 1:
              raise SystemExit('test insertion anchor mismatch')
          tests = r'''

    def test_classifier_rejects_root_writable_and_extra_runtime_authority(self):
        attacks = {
            "root-user": ["--user", "0:0"],
            "writable-root": ["--read-only=false"],
            "shadow-executor-run": ["--tmpfs", "/executor-run:rw"],
            "unapproved-runtime": ["--runtime", "runc"],
        }
        for label, extra in attacks.items():
            with self.subTest(label=label):
                argv = self._network_git_argv()
                image_index = argv.index("git-image")
                argv[image_index:image_index] = extra
                allowed, _, reason = classify_broker_argv(
                    argv,
                    git_image="git-image",
                    sandbox_image_id="sandbox-image-id",
                    canonical_url=CANONICAL_URL,
                    created=set(),
                )
                self.assertFalse(
                    allowed,
                    f"authority downgrade was accepted: {label}: {reason}",
                )

    def test_version_only_broker_ledger_cannot_preserve_authoritative_pass(self):
        baseline, module_path, temporary, fixture = self._fixture()
        try:
            _write_valid_broker(fixture, baseline)
            report = verify(
                acceptance_path=fixture.acceptance,
                controller_dir=fixture.controller,
                execution_dir=fixture.execution,
                candidate_dir=fixture.candidate,
                source_anchor_root=fixture.source_anchors,
                output_dir=fixture.output,
            )
            self.assertEqual(report["authoritative_result"], "PASS", report)
            gate = apply_broker_gate(
                execution_dir=fixture.execution,
                gate_path=fixture.output / "authoritative-final-gate.json",
                output_path=fixture.output / "docker-command-broker-verification.json",
            )
            self.assertEqual(
                gate["authoritative_result"],
                "FAIL",
                "a version-only broker ledger cannot prove CASE-001–003 execution",
            )
            self.assertTrue(
                any("execution transcript" in error.lower() for error in gate["errors"]),
                gate["errors"],
            )
        finally:
            temporary.cleanup()
            module_path.unlink(missing_ok=True)

    def test_network_fetch_cannot_trust_candidate_writable_git_configuration(self):
        argv = self._network_git_argv()
        allowed, _, reason = classify_broker_argv(
            argv,
            git_image="git-image",
            sandbox_image_id="sandbox-image-id",
            canonical_url=CANONICAL_URL,
            created=set(),
        )
        self.assertFalse(
            allowed,
            "canonical argv is not an effective origin proof when repository.git/config "
            "is candidate-writable and may contain url.*.insteadOf",
        )
'''
          path.write_text(source.replace(anchor, tests + anchor), encoding='utf-8')
          PY
          test "$(git diff --name-only)" = tests/test_p1_verifier.py

      - name: Prove expected red result
        shell: bash
        run: |
          set -uo pipefail
          python -m compileall -q tests/test_p1_verifier.py
          set +e
          python -m unittest \
            tests.test_p1_verifier.DockerCommandBrokerTests.test_classifier_rejects_root_writable_and_extra_runtime_authority \
            tests.test_p1_verifier.DockerCommandBrokerTests.test_version_only_broker_ledger_cannot_preserve_authoritative_pass \
            tests.test_p1_verifier.DockerCommandBrokerTests.test_network_fetch_cannot_trust_candidate_writable_git_configuration \
            -v |& tee /tmp/red-tests.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -F 'authority downgrade was accepted' /tmp/red-tests.log
          grep -F 'version-only broker ledger cannot prove' /tmp/red-tests.log
          grep -F 'candidate-writable' /tmp/red-tests.log

      - name: Create test-only commit and publish object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Executor adversarial reviewer'
          git config user.email 'executor-adversarial-review@users.noreply.github.com'
          blob="$(git hash-object -w tests/test_p1_verifier.py)"
          printf 'RED_TEST_BLOB %s\n' "$blob"
          git add tests/test_p1_verifier.py
          git commit -m 'Add adversarial broker false-success tests'
          commit="$(git rev-parse HEAD)"
          printf 'RED_TEST_COMMIT %s\n' "$commit"
          git push origin HEAD:refs/heads/agent/pr32-adversarial-red-staging
