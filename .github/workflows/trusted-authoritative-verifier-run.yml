name: Trusted authoritative verifier run

on:
  workflow_dispatch:

jobs:
  trusted-authoritative-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout verifier repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: litrgratis-pixel/Executor
          ref: main
          path: verifier
          persist-credentials: false
          fetch-depth: 1

      - name: Download artifact from same run
        uses: actions/download-artifact@v4
        with:
          name: P1_TEST_ARTIFACT
          path: downloaded

      - name: Run verifier entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python verifier/tools/p1_verifier/verify_candidate.py
