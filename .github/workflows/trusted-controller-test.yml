name: Trusted controller allocation test

on:
  push:
  workflow_dispatch:

jobs:
  trusted-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          path: controller
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: 3f6e4196af4b9144ceaaba08f2b6637acdc1698d
          fetch-depth: 0
          persist-credentials: false

      - name: Verify
        env:
          EXPECTED_SHA: 3f6e4196af4b9144ceaaba08f2b6637acdc1698d
          ADR_SHA: bf18638caeb1a01cd2e14e625d72a20893a04bb3
        run: |
          set -euo pipefail
          echo "two-checkouts-ok"
          git -C controller rev-parse HEAD
          git -C candidate rev-parse HEAD

          actual_sha="$(git -C candidate rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"

          parent_sha="$(git -C candidate rev-parse HEAD^)"
          test "$parent_sha" = "$ADR_SHA"
