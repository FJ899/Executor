name: GP001 product post-human one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp001-product-post-human-one-shot.yml

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  product-post-human-e2e:
    if: github.repository == 'FJ899/Executor' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ github.token }}
      EXECUTOR_GITHUB_EFFECT_TOKEN: ${{ secrets.EXECUTOR_GITHUB_EFFECT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      DECISION_COMMENT_ID: '5431116950'
      REQUEST_ISSUE_NUMBER: '90'
      TARGET_REPOSITORY: FJ899/executor-pilot-target
      TARGET_COMMIT: 3934a94a5eebf750079200589d6dc40e024d44a0
      TARGET_TREE: 26d307afcbb3ce72b2911ca44936712c11558c4c

    steps:
      - name: Checkout exact Executor candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Arm exactly one ACCEPT-003 continuation commit
        id: arm
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          subject="$(git log -1 --format=%s)"
          if [ "$subject" = 'Execute fresh GP001 ACCEPT-003 end-to-end once' ]; then
            test -n "$EXECUTOR_GITHUB_EFFECT_TOKEN"
            case "$EXECUTOR_GITHUB_EFFECT_TOKEN" in github_pat_*|ghp_*) ;; *) echo 'effect secret is not a GitHub PAT-shaped value' >&2; exit 1 ;; esac
            echo 'armed=true' >> "$GITHUB_OUTPUT"
            echo 'ACCEPT_003_CONTINUATION_ARMED=true'
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo 'ACCEPT_003_CONTINUATION_ARMED=false'
          fi

      - name: Verify effect token against exact target repository
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $EXECUTOR_GITHUB_EFFECT_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPOSITORY" > "${RUNNER_TEMP}/target-repository.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          value=json.loads(Path(os.environ['RUNNER_TEMP'] + '/target-repository.json').read_text(encoding='utf-8'))
          if value.get('full_name') != 'FJ899/executor-pilot-target': raise SystemExit('token resolved a different repository')
          permissions=value.get('permissions') or {}
          if permissions and permissions.get('pull') is not True: raise SystemExit('token lacks target repository read permission')
          if permissions and permissions.get('push') is not True: raise SystemExit('token lacks target repository write permission')
          print('TARGET_TOKEN_REPOSITORY_OK=true')
          PY

      - name: Set up Python
        if: steps.arm.outputs.armed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact product runtime
        if: steps.arm.outputs.armed == 'true'
        run: python -m pip install --no-deps .

      - name: Download fresh formation publication evidence
        if: steps.arm.outputs.armed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9623360112
          path: fresh-request
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33013131624

      - name: Recover exact Issue 90 transport read only from durable receipt
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-output effect-evidence runs
          formation="$(find fresh-request -type f -name formation.json -print -quit)"
          receipt="$(find fresh-request -type f -name 'system_write_receipt-*.json' -print -quit)"
          attempt_result="$(find fresh-request -type f -name 'external_effect_attempt_result-*.json' -print -quit)"
          test -n "$formation" && test -n "$receipt" && test -n "$attempt_result"
          cp "$formation" run-output/formation.json
          curl -fsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/FJ899/Executor/issues/$REQUEST_ISSUE_NUMBER" > "${RUNNER_TEMP}/issue90.json"
          python - "$formation" "$receipt" "$attempt_result" "${RUNNER_TEMP}/issue90.json" <<'PY'
          import base64, hashlib, json, pathlib, sys
          from executor.github_effect_transaction import canonical_effect_bytes
          from executor.github_trust import canonical_json

          formation=json.load(open(sys.argv[1],encoding='utf-8'))
          receipt_path=pathlib.Path(sys.argv[2]); receipt=json.load(open(receipt_path,encoding='utf-8'))
          attempt_result=json.load(open(sys.argv[3],encoding='utf-8'))
          issue=json.load(open(sys.argv[4],encoding='utf-8'))
          canonical=formation.get('canonical_contract_request') or {}
          binding=canonical.get('formation_binding') or {}
          payload=canonical.get('github_request_payload') or {}
          if payload.get('request_id') != 'gp001-product-authority-e2e-002': raise SystemExit('fresh request identity mismatch')
          if payload.get('expires_at') != '2026-08-26T21:59:09Z': raise SystemExit('fresh request expiry mismatch')
          issue_payload={'schema_version':'executor-formation-authority-issue/1.0','title':'Executor authority request: gp001-product-authority-e2e-002','body':canonical_json(payload)}
          effect_sha=hashlib.sha256(canonical_effect_bytes(issue_payload)).hexdigest()

          if receipt.get('kind') != 'SYSTEM_WRITE_RECEIPT': raise SystemExit('missing durable system write receipt')
          rp=receipt.get('payload') or {}
          if rp.get('provider')!='GITHUB' or rp.get('action_kind')!='CREATE_ISSUE' or rp.get('target')!='FJ899/Executor': raise SystemExit('receipt identity mismatch')
          if rp.get('effect_sha256') != effect_sha or rp.get('provider_outcome')!='SUCCESS' or rp.get('provider_status')!=201: raise SystemExit('receipt does not prove successful exact CREATE_ISSUE')
          if rp.get('object_id')!='90' or rp.get('object_url')!='https://github.com/FJ899/Executor/issues/90': raise SystemExit('receipt durable object identity mismatch')
          raw=receipt_path.read_bytes(); digest=hashlib.sha256(raw).hexdigest()
          if receipt_path.stem.removeprefix('system_write_receipt-') != digest: raise SystemExit('receipt filename hash mismatch')
          ap=attempt_result.get('payload') or {}
          if attempt_result.get('kind')!='EXTERNAL_EFFECT_ATTEMPT_RESULT_BINDING' or ap.get('receipt_evidence_sha256')!=digest: raise SystemExit('attempt result does not bind exact receipt')
          if ap.get('provider_outcome')!='SUCCESS' or ap.get('object_id')!='90' or ap.get('object_url')!='https://github.com/FJ899/Executor/issues/90': raise SystemExit('attempt result durable identity mismatch')

          response_b64=receipt.get('provider_response_b64')
          if isinstance(response_b64,str):
              response=json.loads(base64.b64decode(response_b64,validate=True).decode('utf-8'))
              if response.get('number')!=90 or response.get('title')!=issue_payload['title'] or response.get('body')!=issue_payload['body']: raise SystemExit('provider write response differs from exact Issue 90')

          if issue.get('number')!=90 or issue.get('node_id')!='I_kwDOTpqUf88AAAABOZq8KA' or issue.get('state')!='open': raise SystemExit('fresh Issue 90 identity/state mismatch')
          if issue.get('title')!=issue_payload['title'] or issue.get('body')!=issue_payload['body'] or issue.get('html_url')!='https://github.com/FJ899/Executor/issues/90': raise SystemExit('fresh Issue 90 differs from exact formation payload')
          body_sha=hashlib.sha256(issue['body'].encode('utf-8')).hexdigest()
          if body_sha!='78b55f786a17aea61b6727fb4f6172a93cf3a3bbd32e02b98fc038fbe18b35eb': raise SystemExit('Issue 90 body hash mismatch')
          observation_ref=f"github:issue:{issue['node_id']}:{body_sha}"
          effect={
            'schema_version':'executor-github-effect-result/1.0','status':'RECOVERED_EXTERNAL_EFFECT','provider':'GITHUB',
            'action_kind':'CREATE_ISSUE','target':'FJ899/Executor','effect_sha256':effect_sha,
            'attempt_id':ap.get('attempt_id'),'object_id':'90','object_url':'https://github.com/FJ899/Executor/issues/90',
            'observation_ref':observation_ref,'automatic_retry_allowed':False,'external_write_repeated':False,
            'recovered_from_status':'POST_WRITE_SERIALIZATION_FAILURE'
          }
          transport={
            'origin':'FORMATION_PUBLISHED_REQUEST','authority':False,'publisher':'EXECUTOR_FORMATION','provider':'GITHUB',
            'action_kind':'CREATE_ISSUE','target':'FJ899/Executor','object_id':'90','object_url':'https://github.com/FJ899/Executor/issues/90',
            'effect_sha256':effect_sha,'observation_ref':observation_ref,'human_decision_required':True,
            'recovery_class':'POST_WRITE_SERIALIZATION_FAILURE_RECONCILIATION','external_write_repeated':False
          }
          publication={
            'schema_version':'executor-formation-publication-result/1.1','status':'AWAITING_VERIFIED_HUMAN_DECISION',
            'canonical_contract_request':canonical,'formation_binding':binding,'github_request_payload':payload,
            'request_transport_provenance':transport,'publication_effect':effect,
            'manual_request_rewrite_required':False,'executable':False,
            'recovery':{'kind':'READ_ONLY_RECEIPT_AND_PROVIDER_RECONCILIATION','external_write_repeated':False,'source_run_id':33013131624,'source_artifact_id':9623360112}
          }
          pathlib.Path('run-output/publication.json').write_text(json.dumps(publication,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('PUBLICATION_RECOVERED_WITHOUT_WRITE=true')
          print('REQUEST_EXPIRES_AT='+payload['expires_at'])
          PY

      - name: Verify ACCEPT-003 and freeze new exact contract
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product decide \
            --publication run-output/publication.json \
            --profile trust_profiles/github-product-gp001.json \
            --comment "$DECISION_COMMENT_ID" \
            --ledger "${RUNNER_TEMP}/product-authority.sqlite3" \
            > run-output/frozen.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('run-output/frozen.json').read_text(encoding='utf-8'))
          if value.get('status')!='AUTHORIZED_AND_FROZEN': raise SystemExit(f'freeze failed: {value}')
          decision=value.get('decision_evidence') or {}
          if decision.get('comment_id')!=5431116950: raise SystemExit('frozen contract is not bound to ACCEPT-003')
          if value.get('request_transport_provenance',{}).get('object_id')!='90': raise SystemExit('frozen contract is not bound to Issue 90')
          print('FROZEN_CONTRACT_SHA256='+value['contract_sha256'])
          print('DECISION_EXPIRES_AT='+decision['expires_at'])
          PY

      - name: Checkout exact bounded target source
        if: steps.arm.outputs.armed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/executor-pilot-target
          ref: ${{ env.TARGET_COMMIT }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target commit and tree
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git -C target status --porcelain)"

      - name: Re-derive zero-effect solution through provider boundary
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from executor.solution_provider import generate_validated_solution
          from executor.solution_proposal import validate_solution_proposal
          frozen=json.loads(Path('run-output/frozen.json').read_text())
          p=Path('target/project_registry/registry.py'); source=p.read_text()
          old='''    def add_many(self, projects: Iterable[Project]) -> None:\n        """Add projects one by one, leaving earlier writes after a late duplicate."""\n\n        for project in projects:\n            if project.project_id in self._projects:\n                raise DuplicateProjectError(\n                    f"duplicate project_id: {project.project_id}"\n                )\n            self._projects[project.project_id] = project\n'''
          new='''    def add_many(self, projects: Iterable[Project]) -> None:\n        """Add a batch atomically after validating all project identifiers."""\n\n        batch = list(projects)\n        seen = set(self._projects)\n        for project in batch:\n            if project.project_id in seen:\n                raise DuplicateProjectError(\n                    f"duplicate project_id: {project.project_id}"\n                )\n            seen.add(project.project_id)\n        for project in batch:\n            self._projects[project.project_id] = project\n'''
          if source.count(old)!=1: raise SystemExit('pinned bounded defect block mismatch')
          replacement=source.replace(old,new,1)
          before=hashlib.sha256(source.encode()).hexdigest(); after=hashlib.sha256(replacement.encode()).hexdigest()
          contract=frozen['contract']; task=contract['task']; target=contract['target']
          class Provider:
              provider_name='OPENAI_CHATGPT'; model_name='chatgpt-session'
              def generate_candidate(self,*,frozen_contract,prompt):
                  return {'schema_version':'executor-solution-candidate/1.0','status':'AWAITING_FROZEN_CONTRACT_SHA','proposal_id':'gp001-product-solution-002','repository':target['repository'],'source_commit':target['commit'],'source_tree':target['tree'],'mutations':[{'path':'project_registry/registry.py','expected_before_sha256':before,'replacement_text':replacement,'expected_after_sha256':after}],'rationale':'Validate the complete batch before mutating ProjectRegistry state.','evidence_plan':[*task['postcondition_argv'],*task['regression_argv']]}
          validated=generate_validated_solution(provider=Provider(),frozen_result=frozen,prompt='Re-derive the fresh frozen bounded one-file atomic batch fix without changing protected tests.',historical_candidate_relation='SAME_FIX_REDERIVED')
          proposal={'schema_version':'executor-solution-proposal/1.0','proposal_id':validated.proposal_id,'contract_sha256':validated.contract_sha256,'repository':validated.repository,'source_commit':validated.source_commit,'source_tree':validated.source_tree,'mutations':[x.to_dict() for x in validated.mutations],'rationale':validated.rationale,'evidence_plan':[list(x) for x in validated.evidence_plan],'provenance':validated.provenance}
          checked=validate_solution_proposal(proposal,frozen_result=frozen)
          Path('run-output/proposal.json').write_text(json.dumps(proposal,indent=2,sort_keys=True)+'\n')
          print('PROPOSAL_SHA256='+checked.payload_sha256); print('PROVENANCE_SHA256='+checked.provenance_sha256)
          PY

      - name: Resolve immutable sandbox image
        if: steps.arm.outputs.armed == 'true'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.11-slim
          image="$(docker image inspect --format='{{.Id}}' python:3.11-slim)"
          case "$image" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Execute new contract-bound bounded pilot once
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product execute \
            --frozen run-output/frozen.json \
            --proposal run-output/proposal.json \
            --profile trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/product-authority.sqlite3" \
            --workspace target \
            --runs-root runs \
            --run-id "gp001-product-accept003-${GITHUB_RUN_ID}" \
            --image "${{ steps.image.outputs.image }}" \
            --executor-root . \
            --executor-commit "$(git rev-parse HEAD)" \
            > run-output/pilot-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('run-output/pilot-report.json').read_text())
          if value.get('status')!='ACTION_COMPLETED_REVIEW_REQUIRED': raise SystemExit(f"unexpected pilot status: {value.get('status')}")
          print('PILOT_STATUS='+value['status'])
          PY

      - name: Publish exactly one observed draft PR through canonical effect lifecycle
        if: steps.arm.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product publish-draft-pr \
            --frozen run-output/frozen.json \
            --pilot-report run-output/pilot-report.json \
            --profile trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/product-authority.sqlite3" \
            --evidence-dir effect-evidence \
            --workspace target \
            > run-output/draft-pr-publication.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('run-output/draft-pr-publication.json').read_text())
          if value.get('status')!='DRAFT_PR_CREATED_REVIEW_REQUIRED': raise SystemExit(f"unexpected publication status: {value.get('status')}")
          print('DRAFT_PR_STATUS='+value['status'])
          print('DRAFT_PR_URL='+str(value.get('draft_pr_url') or value.get('object_url') or ''))
          PY

      - name: Verify sandbox cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -a --filter label=creative-os-executor-pilot=p4-bounded-real-pilot --format '{{.ID}}')"
          test -z "$remaining"

      - name: Preserve exact ACCEPT-003 product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-product-accept-003-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-output
            effect-evidence
            runs
          if-no-files-found: warn
          retention-days: 30
