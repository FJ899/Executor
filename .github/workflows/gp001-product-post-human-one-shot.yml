name: GP001 product draft PR publication one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp001-product-post-human-one-shot.yml
      - governance/WORKFLOW_CLASSIFICATION.json

permissions:
  contents: write
  actions: read

jobs:
  publish-draft-pr-once:
    if: github.repository == 'FJ899/Executor' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ github.token }}
      EXECUTOR_GITHUB_EFFECT_TOKEN: ${{ secrets.EXECUTOR_GITHUB_EFFECT_TOKEN }}
      TARGET_REPOSITORY: FJ899/executor-pilot-target
      TARGET_COMMIT: 3934a94a5eebf750079200589d6dc40e024d44a0
      TARGET_TREE: 26d307afcbb3ce72b2911ca44936712c11558c4c
      FROZEN_CONTRACT_SHA256: 74bd926bb2a105d5ac5efc71d56edd7889e86a7ecf29a9b54fb3ba4700d17bf4
      AUTHORITY_RESULT_SHA256: 14248d0fbfed336ac48a445ffb1e2ee7ffab11821bc1d0127ee987031a8d36ca
      EXECUTION_RUN_ID: 33007806386
      EXECUTION_ARTIFACT_ID: 9621264039

    steps:
      - name: Checkout exact publication candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Arm exactly one intended publication commit
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          subject="$(git log -1 --format=%s)"
          if [ "$subject" = 'Publish first frozen product draft PR once' ]; then
            test -n "$EXECUTOR_GITHUB_EFFECT_TOKEN"
            echo 'armed=true' >> "$GITHUB_OUTPUT"
            echo 'PUBLICATION_ARMED=true'
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo 'PUBLICATION_ARMED=false'
          fi

      - name: Set up Python
        if: steps.guard.outputs.armed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact product runtime
        if: steps.guard.outputs.armed == 'true'
        run: python -m pip install --no-deps .

      - name: Download exact successful execution evidence
        if: steps.guard.outputs.armed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.EXECUTION_ARTIFACT_ID }}
          path: prior
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: ${{ env.EXECUTION_RUN_ID }}

      - name: Materialize and bind frozen result, report and patch
        if: steps.guard.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-input effect-evidence
          frozen="$(find prior -type f -name frozen.json -print -quit)"
          report="$(find prior -type f -name pilot-report.json -print -quit)"
          patch="$(find prior -type f -name pilot.patch -print -quit)"
          test -n "$frozen"
          test -n "$report"
          test -n "$patch"
          cp "$frozen" publication-input/frozen.json
          cp "$report" publication-input/pilot-report.json
          cp "$patch" publication-input/pilot.patch
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          frozen = json.loads(Path('publication-input/frozen.json').read_text(encoding='utf-8'))
          report = json.loads(Path('publication-input/pilot-report.json').read_text(encoding='utf-8'))
          patch = Path('publication-input/pilot.patch').read_bytes()
          if frozen.get('status') != 'AUTHORIZED_AND_FROZEN':
              raise SystemExit('frozen authority is not AUTHORIZED_AND_FROZEN')
          if frozen.get('contract_sha256') != '74bd926bb2a105d5ac5efc71d56edd7889e86a7ecf29a9b54fb3ba4700d17bf4':
              raise SystemExit('frozen contract identity mismatch')
          if report.get('status') != 'ACTION_COMPLETED_REVIEW_REQUIRED':
              raise SystemExit('pilot report is not review-required success')
          if report.get('repository') != 'FJ899/executor-pilot-target':
              raise SystemExit('pilot report repository mismatch')
          if report.get('human_review_required') is not True or report.get('merge_allowed') is not False:
              raise SystemExit('review/merge boundary mismatch')
          consumption = report.get('authority_consumption') or {}
          if consumption.get('result_sha256') != '14248d0fbfed336ac48a445ffb1e2ee7ffab11821bc1d0127ee987031a8d36ca':
              raise SystemExit('authority result identity mismatch')
          expected_patch = (report.get('patch') or {}).get('sha256')
          actual_patch = hashlib.sha256(patch).hexdigest()
          if expected_patch != actual_patch:
              raise SystemExit(f'patch SHA mismatch: expected={expected_patch} actual={actual_patch}')
          print('FROZEN_CONTRACT_SHA256=' + frozen['contract_sha256'])
          print('PATCH_SHA256=' + actual_patch)
          PY

      - name: Checkout exact frozen target source
        if: steps.guard.outputs.armed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/executor-pilot-target
          ref: ${{ env.TARGET_COMMIT }}
          path: target
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.EXECUTOR_GITHUB_EFFECT_TOKEN }}

      - name: Verify target source and apply exact verified patch
        if: steps.guard.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git -C target status --porcelain)"
          git -C target apply --check ../publication-input/pilot.patch
          git -C target apply ../publication-input/pilot.patch

      - name: Publish exactly one observed draft PR through Executor effect lifecycle
        if: steps.guard.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product publish-draft-pr \
            --frozen publication-input/frozen.json \
            --pilot-report publication-input/pilot-report.json \
            --profile trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/publication-authority.sqlite3" \
            --evidence-dir effect-evidence \
            --workspace target \
            > publication-input/publication-result.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('publication-input/publication-result.json').read_text(encoding='utf-8'))
          if result.get('status') != 'DRAFT_PR_CREATED_REVIEW_REQUIRED':
              raise SystemExit(f"publication did not reach draft review boundary: {result}")
          if result.get('merge_allowed') is not False:
              raise SystemExit('publication unexpectedly permits merge')
          print('PUBLICATION_STATUS=' + result['status'])
          print('DRAFT_PR_URL=' + str(result.get('pull_request_url') or result.get('url') or ''))
          PY

      - name: Preserve effect evidence even on failure
        if: ${{ always() && steps.guard.outputs.armed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-product-draft-pr-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            publication-input
            effect-evidence
          if-no-files-found: warn
          retention-days: 30
