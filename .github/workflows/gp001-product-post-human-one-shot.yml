name: GP001 product post-human one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp001-product-post-human-one-shot.yml

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  product-post-human-e2e:
    if: github.repository == 'FJ899/Executor' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ github.token }}
      EXECUTOR_GITHUB_EFFECT_TOKEN: ${{ secrets.EXECUTOR_GITHUB_EFFECT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      DECISION_COMMENT_ID: '5430092638'
      TARGET_COMMIT: 3934a94a5eebf750079200589d6dc40e024d44a0
      TARGET_TREE: 26d307afcbb3ce72b2911ca44936712c11558c4c

    steps:
      - name: Checkout exact Executor candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact Executor identity
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact product runtime
        run: python -m pip install --no-deps .

      - name: Download recovered publication artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9620012182
          path: recovered
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33004652210

      - name: Materialize recovered publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-output effect-evidence runs
          publication="$(find recovered -type f -name publication.json -print -quit)"
          test -n "$publication"
          cp "$publication" run-output/publication.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('run-output/publication.json').read_text())
          assert value['status']=='AWAITING_VERIFIED_HUMAN_DECISION'
          assert value['request_transport_provenance']['object_id']=='88'
          assert value['publication_effect']['external_write_repeated'] is False
          PY

      - name: Verify direct-human decision and freeze exact contract
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product decide \
            --publication run-output/publication.json \
            --profile trust_profiles/github-product-gp001.json \
            --comment "$DECISION_COMMENT_ID" \
            --ledger "${RUNNER_TEMP}/product-authority.sqlite3" \
            > run-output/frozen.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('run-output/frozen.json').read_text())
          assert value['status']=='AUTHORIZED_AND_FROZEN'
          print('FROZEN_CONTRACT_SHA256='+value['contract_sha256'])
          PY

      - name: Checkout exact bounded target source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/executor-pilot-target
          ref: ${{ env.TARGET_COMMIT }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target commit and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C target rev-parse HEAD)" = "$TARGET_COMMIT"
          test "$(git -C target rev-parse 'HEAD^{tree}')" = "$TARGET_TREE"
          test -z "$(git -C target status --porcelain)"

      - name: Re-derive zero-effect solution through provider boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from executor.solution_provider import generate_validated_solution
          from executor.solution_proposal import validate_solution_proposal

          frozen=json.loads(Path('run-output/frozen.json').read_text())
          p=Path('target/project_registry/registry.py')
          source=p.read_text()
          old='''    def add_many(self, projects: Iterable[Project]) -> None:\n        """Add projects one by one, leaving earlier writes after a late duplicate."""\n\n        for project in projects:\n            if project.project_id in self._projects:\n                raise DuplicateProjectError(\n                    f"duplicate project_id: {project.project_id}"\n                )\n            self._projects[project.project_id] = project\n'''
          new='''    def add_many(self, projects: Iterable[Project]) -> None:\n        """Add a batch atomically after validating all project identifiers."""\n\n        batch = list(projects)\n        seen = set(self._projects)\n        for project in batch:\n            if project.project_id in seen:\n                raise DuplicateProjectError(\n                    f"duplicate project_id: {project.project_id}"\n                )\n            seen.add(project.project_id)\n        for project in batch:\n            self._projects[project.project_id] = project\n'''
          if source.count(old)!=1: raise SystemExit('pinned bounded defect block mismatch')
          replacement=source.replace(old,new,1)
          before=hashlib.sha256(source.encode()).hexdigest()
          after=hashlib.sha256(replacement.encode()).hexdigest()
          contract=frozen['contract']; task=contract['task']; target=contract['target']

          class Provider:
              provider_name='OPENAI_CHATGPT'
              model_name='chatgpt-session'
              def generate_candidate(self,*,frozen_contract,prompt):
                  return {
                    'schema_version':'executor-solution-candidate/1.0',
                    'status':'AWAITING_FROZEN_CONTRACT_SHA',
                    'proposal_id':'gp001-product-solution-001',
                    'repository':target['repository'],
                    'source_commit':target['commit'],
                    'source_tree':target['tree'],
                    'mutations':[{'path':'project_registry/registry.py','expected_before_sha256':before,'replacement_text':replacement,'expected_after_sha256':after}],
                    'rationale':'Validate the complete batch before mutating ProjectRegistry state.',
                    'evidence_plan':[*task['postcondition_argv'],*task['regression_argv']],
                  }

          validated=generate_validated_solution(
              provider=Provider(),frozen_result=frozen,
              prompt='Re-derive the frozen bounded one-file atomic batch fix without changing protected tests.',
              historical_candidate_relation='SAME_FIX_REDERIVED')
          proposal={
            'schema_version':'executor-solution-proposal/1.0',
            'proposal_id':validated.proposal_id,
            'contract_sha256':validated.contract_sha256,
            'repository':validated.repository,
            'source_commit':validated.source_commit,
            'source_tree':validated.source_tree,
            'mutations':[x.to_dict() for x in validated.mutations],
            'rationale':validated.rationale,
            'evidence_plan':[list(x) for x in validated.evidence_plan],
            'provenance':validated.provenance,
          }
          checked=validate_solution_proposal(proposal,frozen_result=frozen)
          Path('run-output/proposal.json').write_text(json.dumps(proposal,indent=2,sort_keys=True)+'\n')
          print('PROPOSAL_SHA256='+checked.payload_sha256)
          print('PROVENANCE_SHA256='+checked.provenance_sha256)
          PY

      - name: Resolve immutable sandbox image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          docker pull python:3.11-slim
          image="$(docker image inspect --format='{{.Id}}' python:3.11-slim)"
          case "$image" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1 ;; esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Execute bounded pilot under frozen authority
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product execute \
            --frozen run-output/frozen.json \
            --proposal run-output/proposal.json \
            --profile trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/product-authority.sqlite3" \
            --workspace target \
            --runs-root runs \
            --run-id "gp001-product-${GITHUB_RUN_ID}" \
            --image "${{ steps.image.outputs.image }}" \
            --executor-root . \
            --executor-commit "$(git rev-parse HEAD)" \
            > run-output/pilot-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('run-output/pilot-report.json').read_text())
          assert value['status']=='ACTION_COMPLETED_REVIEW_REQUIRED'
          print('PILOT_STATUS='+value['status'])
          PY
          git -C target diff --binary > run-output/pilot.patch
          test -s run-output/pilot.patch

      - name: Record unavailable cross-repository publication credential
        if: env.EXECUTOR_GITHUB_EFFECT_TOKEN == ''
        shell: bash
        run: |
          cat > run-output/draft-pr-publication.json <<'JSON'
          {"schema_version":"executor-product-publication-boundary/1.0","status":"DRAFT_PR_PUBLICATION_BLOCKED_CREDENTIAL","external_write_attempted":false,"required_credential":"EXECUTOR_GITHUB_EFFECT_TOKEN","target":"FJ899/executor-pilot-target"}
          JSON
          echo 'DRAFT_PR_PUBLICATION_BLOCKED_CREDENTIAL'

      - name: Publish bounded draft PR through product effect lifecycle
        if: env.EXECUTOR_GITHUB_EFFECT_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product publish-draft-pr \
            --frozen run-output/frozen.json \
            --pilot-report run-output/pilot-report.json \
            --profile trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/product-authority.sqlite3" \
            --evidence-dir effect-evidence \
            --workspace target \
            > run-output/draft-pr-publication.json
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('run-output/draft-pr-publication.json').read_text())
          assert value['status']=='DRAFT_PR_CREATED_REVIEW_REQUIRED'
          print('DRAFT_PR_STATUS='+value['status'])
          PY

      - name: Verify sandbox cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -a --filter label=creative-os-executor-pilot=p4-bounded-real-pilot --format '{{.ID}}')"
          test -z "$remaining"

      - name: Preserve exact product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-product-post-human-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-output
            effect-evidence
            runs
          if-no-files-found: warn
          retention-days: 30
