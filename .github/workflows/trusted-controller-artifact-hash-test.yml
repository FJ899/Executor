name: Trusted controller artifact-hash test

on:
  workflow_dispatch:

jobs:
  trusted-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: controller
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: candidate
          ref: agent/pilot-runtime-replacement
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare artifact hashes
        shell: bash
        env:
          CONTROLLER_ARTIFACT: /tmp/p1-controller
        run: |
          set -euo pipefail
          mkdir -p "$CONTROLLER_ARTIFACT"

          printf 'controller workflow\n' > "$CONTROLLER_ARTIFACT/controller-workflow.yml"
          printf 'candidate workflow\n' > "$CONTROLLER_ARTIFACT/candidate-verify.yml"
          printf 'trusted verifier\n' > "$CONTROLLER_ARTIFACT/trusted-verifier.py"
          printf 'acceptance manifest\n' > "$CONTROLLER_ARTIFACT/acceptance-manifest.json"
          printf 'trusted broker verifier\n' > "$CONTROLLER_ARTIFACT/trusted-broker-verifier.py"
          printf '{"status":"PASS"}\n' > "$CONTROLLER_ARTIFACT/scope-report.json"
          printf '{"status":"PASS"}\n' > "$CONTROLLER_ARTIFACT/controller-manifest.json"
          printf '{"status":"PASS"}\n' > "$CONTROLLER_ARTIFACT/workflow-identities.json"

          python - "$CONTROLLER_ARTIFACT" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          files = {}
          for path in sorted(root.iterdir()):
              if path.is_file():
                  files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()

          print(json.dumps(files, indent=2))
          PY

          echo "ARTIFACT_HASH_PASS"
