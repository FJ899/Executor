name: P4 change-stability non-consequential preflight

on:
  push:
    branches:
      - preflight-run/p4-pyyaml-6.0.3

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 03ec27d3015b5c086a5dc6db7dc558208fe2a478
      CANDIDATE_SHA: 46ca62f02bca717d39426127beb830b4c274552a
      CANDIDATE_TREE: 11bee39356d16c30a6efb56f5d8383834a25b0fa
      CANDIDATE_WORKFLOW_BLOB: 30357adc1b1cd0717682d6bfd381fb4e4212e382
      OLD_BASE_DIGEST: sha256:2e32f7d302adc1c37428355c1e646897c0c53f4fd60b6a551245fb90ee129f91
      OLD_PYYAML_WHEEL_SHA256: 3ad2a3decf9aaba3d29c8f537ac4b243e36bef957511b4766cb0057d32b0be85
      NEW_PYYAML_WHEEL_SHA256: b8bb0864c5a28024fac8a632c443c87c5aa6f215c0b126c449ae1a150412f31d
      OLD_SCRIPTOPS_IMAGE: sha256:64b16275b427cc370fb9a6066ef3921fbedd9523b5779574a492f68f9d2d760e
      SCRIPTOPS_SHA: daa6e5dc210e09171a530eeffe5601e0e74ae041
      SCRIPTOPS_TREE: ba0b99bd99682dcc7a942537b502a7a72151fa09
      RECONSTRUCTOR_SHA: defc7b029097284f94136fec54b75c313ac12f68
      RECONSTRUCTOR_TREE: 5960d74773b19456863ac66084385b7619aa4285
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Checkout trusted preflight controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: controller

      - name: Checkout exact candidate without running P4 pilot workflow
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate

      - name: Prove preflight controller is non-consequential
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C controller rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git -C controller status --porcelain --untracked-files=all)"
          ! grep -E 'github-pilot-decide|materialize-pilot-proposal|run-pilot' controller/.github/workflows/p4-change-stability-preflight.yml
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C candidate rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"

      - name: Bind candidate identity and prove one-line dependency-only diff
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          mkdir -p "$out"
          git -C candidate rev-parse HEAD > "$out/candidate-head.txt"
          git -C candidate rev-parse 'HEAD^{tree}' > "$out/candidate-tree.txt"
          git -C candidate hash-object .github/workflows/p4-real-pilots-one-shot.yml > "$out/candidate-workflow-blob.txt"
          test "$(cat "$out/candidate-workflow-blob.txt")" = "$CANDIDATE_WORKFLOW_BLOB"
          sha256sum candidate/.github/workflows/p4-real-pilots-one-shot.yml > "$out/candidate-workflow-sha256.txt"
          git -C candidate diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" > "$out/changed-paths.txt"
          printf '%s\n' '.github/workflows/p4-real-pilots-one-shot.yml' > "$out/expected-paths.txt"
          diff -u "$out/expected-paths.txt" "$out/changed-paths.txt"
          git -C candidate diff --no-ext-diff --no-textconv "$BASE_SHA" "$CANDIDATE_SHA" -- .github/workflows/p4-real-pilots-one-shot.yml > "$out/candidate.diff"
          python - "$PWD/candidate" "$BASE_SHA" <<'PY'
          import pathlib, subprocess, sys
          repo = pathlib.Path(sys.argv[1])
          base = sys.argv[2]
          path = '.github/workflows/p4-real-pilots-one-shot.yml'
          old = subprocess.check_output(['git','-C',str(repo),'show',f'{base}:{path}'])
          new = (repo / path).read_bytes()
          old_token = b'PyYAML==6.0.2'
          new_token = b'PyYAML==6.0.3'
          assert old.count(old_token) == 1
          assert new.count(new_token) == 1
          assert old.replace(old_token, new_token, 1) == new
          assert b'PyYAML==6.0.2' not in new
          PY

      - name: Run pinned actionlint on candidate and controller workflows
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -version | tee "$out/actionlint-version.txt"
          "$tool_dir/actionlint" -shellcheck= candidate/.github/workflows/p4-real-pilots-one-shot.yml controller/.github/workflows/p4-change-stability-preflight.yml 2>&1 | tee "$out/actionlint.txt"

      - name: Confirm PyYAML 6.0.3 provider artifact identity
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          mkdir -p "$RUNNER_TEMP/pyyaml-wheel"
          python3 -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/pyyaml-wheel" 'PyYAML==6.0.3' 2>&1 | tee "$out/pyyaml-download.txt"
          wheel="$(find "$RUNNER_TEMP/pyyaml-wheel" -maxdepth 1 -type f -name 'pyyaml-6.0.3-cp311-cp311-manylinux*x86_64.whl' -print -quit)"
          test -n "$wheel"
          sha256sum "$wheel" | tee "$out/pyyaml-6.0.3-wheel-sha256.txt"
          test "$(sha256sum "$wheel" | awk '{print $1}')" = "$NEW_PYYAML_WHEEL_SHA256"
          printf '%s\n' "$OLD_PYYAML_WHEEL_SHA256" > "$out/pyyaml-6.0.2-accepted-wheel-sha256.txt"
          printf '%s\n' "$NEW_PYYAML_WHEEL_SHA256" > "$out/pyyaml-6.0.3-provider-wheel-sha256.txt"

      - name: Resolve base identity and require accepted base digest
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          docker pull python:3.11-slim-bookworm 2>&1 | tee "$out/base-pull.txt"
          docker image inspect --format='{{.Id}}' python:3.11-slim-bookworm | tee "$out/base-image-id.txt"
          docker image inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' python:3.11-slim-bookworm | tee "$out/base-repodigests.txt"
          grep -Fx "python@${OLD_BASE_DIGEST}" "$out/base-repodigests.txt"

      - name: Build exact new ScriptOps execution image only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          cat > "$RUNNER_TEMP/p4-scriptops.Dockerfile" <<'DOCKERFILE'
          FROM python:3.11-slim-bookworm
          RUN apt-get update \
              && apt-get install -y --no-install-recommends git \
              && rm -rf /var/lib/apt/lists/* \
              && python -m pip install --no-cache-dir PyYAML==6.0.3
          DOCKERFILE
          docker build --pull -f "$RUNNER_TEMP/p4-scriptops.Dockerfile" -t executor-scriptops-preflight:pyyaml-6.0.3 candidate 2>&1 | tee "$out/new-image-build.txt"
          docker image inspect --format='{{.Id}}' executor-scriptops-preflight:pyyaml-6.0.3 | tee "$out/new-image-id.txt"
          test "$(cat "$out/new-image-id.txt")" != "$OLD_SCRIPTOPS_IMAGE"
          docker image inspect executor-scriptops-preflight:pyyaml-6.0.3 > "$out/new-image-inspect.json"

      - name: Verify new image dependency and unchanged apt package versions
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          docker run --rm executor-scriptops-preflight:pyyaml-6.0.3 python -c 'import yaml; assert yaml.__version__ == "6.0.3"; print(yaml.__version__)' | tee "$out/new-image-pyyaml-version.txt"
          docker run --rm executor-scriptops-preflight:pyyaml-6.0.3 git --version | tee "$out/new-image-git-version.txt"
          cat > "$out/expected-apt-runtime-packages.txt" <<'PKGS'
          git=1:2.39.5-0+deb12u3
          git-man=1:2.39.5-0+deb12u3
          libbrotli1=1.0.9-2+b6
          libcurl3-gnutls=7.88.1-10+deb12u15
          liberror-perl=0.17029-2
          libexpat1=2.5.0-1+deb12u2
          libgdbm-compat4=1.23-3
          libldap-2.5-0=2.5.13+dfsg-5
          libnghttp2-14=1.52.0-1+deb12u3
          libperl5.36=5.36.0-7+deb12u3
          libpsl5=0.21.2-1
          librtmp1=2.4+20151223.gitfa8646d.1-2+b2
          libsasl2-2=2.1.28+dfsg-10
          libsasl2-modules-db=2.1.28+dfsg-10
          libssh2-1=1.10.0-3+b1
          perl=5.36.0-7+deb12u3
          perl-modules-5.36=5.36.0-7+deb12u3
          PKGS
          docker run --rm executor-scriptops-preflight:pyyaml-6.0.3 sh -c 'dpkg-query -W -f="${Package}=${Version}\n" git git-man libbrotli1 libcurl3-gnutls liberror-perl libexpat1 libgdbm-compat4 libldap-2.5-0 libnghttp2-14 libperl5.36 libpsl5 librtmp1 libsasl2-2 libsasl2-modules-db libssh2-1 perl perl-modules-5.36 | LC_ALL=C sort' > "$out/actual-apt-runtime-packages.txt"
          LC_ALL=C sort "$out/expected-apt-runtime-packages.txt" -o "$out/expected-apt-runtime-packages.txt"
          diff -u "$out/expected-apt-runtime-packages.txt" "$out/actual-apt-runtime-packages.txt" | tee "$out/apt-runtime-package-diff.txt"

      - name: Verify exact target source identities read-only
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          git clone https://github.com/JTJ07/scriptops.git "$RUNNER_TEMP/scriptops" 2>&1 | tee "$out/scriptops-clone.txt"
          git -C "$RUNNER_TEMP/scriptops" checkout "$SCRIPTOPS_SHA"
          test "$(git -C "$RUNNER_TEMP/scriptops" rev-parse HEAD)" = "$SCRIPTOPS_SHA"
          test "$(git -C "$RUNNER_TEMP/scriptops" rev-parse 'HEAD^{tree}')" = "$SCRIPTOPS_TREE"
          test -z "$(git -C "$RUNNER_TEMP/scriptops" status --porcelain --untracked-files=all)"
          printf '%s\n%s\n' "$SCRIPTOPS_SHA" "$SCRIPTOPS_TREE" > "$out/scriptops-source-identity.txt"
          git clone https://github.com/JTJ07/creative-os-project-reconstructor.git "$RUNNER_TEMP/reconstructor" 2>&1 | tee "$out/reconstructor-clone.txt"
          git -C "$RUNNER_TEMP/reconstructor" checkout "$RECONSTRUCTOR_SHA"
          test "$(git -C "$RUNNER_TEMP/reconstructor" rev-parse HEAD)" = "$RECONSTRUCTOR_SHA"
          test "$(git -C "$RUNNER_TEMP/reconstructor" rev-parse 'HEAD^{tree}')" = "$RECONSTRUCTOR_TREE"
          test -z "$(git -C "$RUNNER_TEMP/reconstructor" status --porcelain --untracked-files=all)"
          printf '%s\n%s\n' "$RECONSTRUCTOR_SHA" "$RECONSTRUCTOR_TREE" > "$out/reconstructor-source-identity.txt"

      - name: Set up Python for candidate validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run non-consequential Executor foundation validation
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          python -m compileall -q executor
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist 2>&1 | tee "$out/wheel-build.txt"
          python -m venv .venv-smoke
          .venv-smoke/bin/python -m pip install --no-index dist/*.whl 2>&1 | tee "$out/wheel-install.txt"
          .venv-smoke/bin/creative-os-executor --help > "$out/cli-help.txt"
          python -m unittest discover -s tests -v 2>&1 | tee "$out/unit-tests.txt"
          python -m executor.cli validate-project project_contracts/executor-self.yaml --policy EXECUTOR_POLICY.yaml --base-dir . > "$out/validate-project.txt"
          python -m executor.cli validate-task tasks/examples/EXECUTOR_TASK_FIXTURE-001.yaml --policy EXECUTOR_POLICY.yaml --base-dir . --repository-root JTJ07/Executor=. > "$out/validate-task.txt"
          python -m executor.cli validate-test test_contracts/examples/valid_test.yaml --base-dir tests/fixtures --holdout-evidence tests/fixtures/holdout_evidence.json > "$out/validate-test.txt"

      - name: Run non-consequential Docker sandbox security validation
        shell: bash
        working-directory: candidate
        env:
          RUN_DOCKER_TESTS: '1'
          HOST_EXECUTOR_SECRET: must-not-reach-container
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          export EXECUTOR_SANDBOX_IMAGE="$(docker image inspect --format='{{.Id}}' python:3.11-slim-bookworm)"
          python -m unittest tests.test_sandbox_integration -v 2>&1 | tee "$out/sandbox-tests.txt"
          test -z "$(docker ps -aq --filter label=creative-os-executor-test=true)"

      - name: Record preflight PASS summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/p4-change-preflight"
          cat > "$out/preflight-summary.txt" <<EOF
          RESULT=PASS
          BASE_SHA=$BASE_SHA
          CANDIDATE_SHA=$CANDIDATE_SHA
          CANDIDATE_TREE=$CANDIDATE_TREE
          CANDIDATE_WORKFLOW_BLOB=$CANDIDATE_WORKFLOW_BLOB
          OLD_DEPENDENCY=PyYAML==6.0.2
          NEW_DEPENDENCY=PyYAML==6.0.3
          OLD_IMAGE=$OLD_SCRIPTOPS_IMAGE
          NEW_IMAGE=$(cat "$out/new-image-id.txt")
          SCRIPTOPS_SHA=$SCRIPTOPS_SHA
          SCRIPTOPS_TREE=$SCRIPTOPS_TREE
          RECONSTRUCTOR_SHA=$RECONSTRUCTOR_SHA
          RECONSTRUCTOR_TREE=$RECONSTRUCTOR_TREE
          CONSEQUENTIAL_EXECUTIONS=0
          EFFECT_CONSUMPTIONS=0
          EOF

      - name: Upload non-consequential preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p4-change-stability-preflight-evidence
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/p4-change-preflight/**
