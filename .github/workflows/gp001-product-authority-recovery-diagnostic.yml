name: GP001 product authority recovery diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp001-product-authority-recovery-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  inspect-product-execution-recovery:
    if: github.repository == 'FJ899/Executor' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download failed product execution recovery artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9620813685
          path: diagnostic
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33006665936

      - name: Print exact bounded execution state
        shell: bash
        run: |
          set -euo pipefail
          find diagnostic -type f -maxdepth 10 -print | sort
          echo '--- pilot-report.json ---'
          report="$(find diagnostic -type f -name pilot-report.json -print -quit)"
          test -n "$report"
          cat "$report"
          echo
          echo '--- persisted runtime JSON ---'
          for f in $(find diagnostic -type f -path '*runs*' -name '*.json' -print | sort); do
            echo "### $f"
            cat "$f"
            echo
          done
