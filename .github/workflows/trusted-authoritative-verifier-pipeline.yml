name: Trusted authoritative verifier pipeline

on:
  workflow_dispatch:

jobs:
  trusted-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Create artifact payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          echo hello > out/test.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: P1_TEST_ARTIFACT
          path: out

  trusted-authoritative-verifier:
    needs: trusted-controller
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download artifact from same run
        uses: actions/download-artifact@v4
        with:
          name: P1_TEST_ARTIFACT
          path: downloaded

      - name: Verify artifact availability
        shell: bash
        run: |
          set -euo pipefail
          cat downloaded/test.txt
          echo VERIFIER_DOWNLOAD_PASS
