name: Phase C G04 direct-human hotfix

on:
  push:
    branches: [phase-b/p4-repeatable-executor-1.0]

permissions:
  contents: write

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-b/p4-repeatable-executor-1.0
          fetch-depth: 0

      - name: Apply fail-closed direct-human origin fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'executor/github_trust.py',
              '''    if event.get("author_association") not in {"OWNER", "MEMBER", "COLLABORATOR"}:\n        raise GitHubTrustError(f"{label} actor lacks governed repository association")\n    return login, actor_id\n''',
              '''    if event.get("author_association") not in {"OWNER", "MEMBER", "COLLABORATOR"}:\n        raise GitHubTrustError(f"{label} actor lacks governed repository association")\n    if "performed_via_github_app" not in event:\n        raise GitHubTrustError(\n            f"{label} direct-human origin is not provider-verifiable"\n        )\n    if event["performed_via_github_app"] is not None:\n        raise GitHubTrustError(\n            f"{label} is app-mediated, not a direct-human GitHub event"\n        )\n    return login, actor_id\n'''
          )

          replace_once(
              'tests/test_github_trust.py',
              '''        "author_association": "OWNER",\n        "user": {"login": "JTJ07", "id": 219382941, "type": "User"},\n    }\n\n\ndef decision_payload''',
              '''        "author_association": "OWNER",\n        "performed_via_github_app": None,\n        "user": {"login": "JTJ07", "id": 219382941, "type": "User"},\n    }\n\n\ndef decision_payload'''
          )
          replace_once(
              'tests/test_github_trust.py',
              '''        "author_association": "OWNER",\n        "user": {"login": "JTJ07", "id": 219382941, "type": "User"},\n    }\n\n\nclass GitHubTrustTests''',
              '''        "author_association": "OWNER",\n        "performed_via_github_app": None,\n        "user": {"login": "JTJ07", "id": 219382941, "type": "User"},\n    }\n\n\nclass GitHubTrustTests'''
          )

          marker = '''    def test_request_commit_tree_must_match_live_github(self):\n'''
          tests = '''    def test_app_mediated_request_blocks(self):\n        payload = request_payload()\n        mediated = issue(json.dumps(payload, sort_keys=True))\n        mediated["performed_via_github_app"] = {"id": 123, "slug": "executor-bot"}\n        source = FakeSource(\n            {\n                ISSUE_URL: mediated,\n                commit_url(payload): commit_evidence(payload),\n            }\n        )\n        with self.assertRaisesRegex(GitHubTrustError, "app-mediated"):\n            verify_github_request(source, profile=profile(), issue_number=61, now=NOW)\n\n    def test_missing_request_direct_human_signal_blocks(self):\n        payload = request_payload()\n        missing = issue(json.dumps(payload, sort_keys=True))\n        missing.pop("performed_via_github_app")\n        source = FakeSource(\n            {\n                ISSUE_URL: missing,\n                commit_url(payload): commit_evidence(payload),\n            }\n        )\n        with self.assertRaisesRegex(GitHubTrustError, "provider-verifiable"):\n            verify_github_request(source, profile=profile(), issue_number=61, now=NOW)\n\n    def test_app_mediated_decision_blocks(self):\n        source, request, draft, _ = self.verified_pair()\n        mediated = comment(decision_payload(request, pilot_draft_sha256(draft)))\n        mediated["performed_via_github_app"] = {"id": 123, "slug": "executor-bot"}\n        source.values[COMMENT_URL] = mediated\n        with self.assertRaisesRegex(GitHubTrustError, "app-mediated"):\n            verify_github_decision(\n                source,\n                profile=profile(),\n                request=request,\n                comment_id=9001,\n                draft_sha256=pilot_draft_sha256(draft),\n                now=NOW,\n            )\n\n    def test_missing_decision_direct_human_signal_blocks(self):\n        source, request, draft, _ = self.verified_pair()\n        missing = comment(decision_payload(request, pilot_draft_sha256(draft)))\n        missing.pop("performed_via_github_app")\n        source.values[COMMENT_URL] = missing\n        with self.assertRaisesRegex(GitHubTrustError, "provider-verifiable"):\n            verify_github_decision(\n                source,\n                profile=profile(),\n                request=request,\n                comment_id=9001,\n                draft_sha256=pilot_draft_sha256(draft),\n                now=NOW,\n            )\n\n'''
          p = Path('tests/test_github_trust.py')
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('test insertion marker mismatch')
          p.write_text(text.replace(marker, tests + marker), encoding='utf-8')

          replace_once(
              'tests/test_corrected_request_hashes.py',
              '''                    "author_association": "OWNER",\n                    "user": {\n''',
              '''                    "author_association": "OWNER",\n                    "performed_via_github_app": None,\n                    "user": {\n'''
          )

          replace_once(
              'tests/test_p4_evidence_artifacts.py',
              '''                    "author_association": "OWNER",\n                    "user": {\n''',
              '''                    "author_association": "OWNER",\n                    "performed_via_github_app": None,\n                    "user": {\n'''
          )

          handoff = Path('evidence/phase-c/PHASE_C_HANDOFF.md')
          handoff_text = handoff.read_text(encoding='utf-8')
          anchor = '## Corrective architecture to verify\n'
          section = '''## Latest independent false-completion finding\n\nIndependent Phase C rejected candidate `fdf876e0e2af6d9e4ecea2301ecb686a471037bd` as `FALSE-COMPLETION` because the GitHub actor verifier accepted app-mediated issue/comment events attributed to the allowed user. GitHub exposes `performed_via_github_app`, but that candidate did not enforce it.\n\nFor every later candidate, direct-human origin is fail-closed for both request and decision events:\n\n- `performed_via_github_app` must be present in provider evidence;\n- its value must be exactly `null`;\n- a non-null app object or a missing provider signal must block before request/decision verification, contract freezing or consequential execution.\n\nThis is a mandatory G-04 regression target. Concrete historical direct-human comments remain provenance only after they are consumed by a rejected exact candidate.\n\n'''
          if section not in handoff_text:
              if handoff_text.count(anchor) != 1:
                  raise SystemExit('handoff anchor mismatch')
              handoff.write_text(handoff_text.replace(anchor, section + anchor), encoding='utf-8')

          manifest_path = Path('evidence/p4/PILOT_CANDIDATE_MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest['corrected_requests']:
              previous = list(item.get('historical_consumed_human_accept_comments', []))
              active = list(item.get('active_fresh_human_accept_comments', []))
              item['historical_consumed_human_accept_comments'] = list(dict.fromkeys(previous + active))
              item['active_fresh_human_accept_comments'] = []
          controls = manifest['corrective_controls']
          control = 'provider-verifiable direct-human origin requires performed_via_github_app to be present and null; app-mediated or missing signals fail closed'
          if control not in controls:
              controls.append(control)
          requirements = manifest['post_commit_evidence_requirements']
          requirement = 'Direct-human request and decision verification must reject non-null or missing performed_via_github_app before any freeze or consequential effect.'
          if requirement not in requirements:
              requirements.append(requirement)
          manifest['current_rule'] = 'Resolve the exact current PR #61 head/tree and exact-head immutable evidence. Direct-human request/decision origin is provider-verifiable only when performed_via_github_app is present and null. Never infer current PASS from historical runs, consumed decisions, mutable prose, or a different SHA.'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          Path('.github/workflows/phase-c-g04-direct-human-hotfix.yml').unlink()
          PY

      - name: Run targeted and full tests
        run: |
          python -m unittest tests.test_github_trust tests.test_corrected_request_hashes tests.test_p4_evidence_artifacts -v
          python -m unittest discover -s tests -v
          python -m compileall -q executor

      - name: Commit hotfix and remove temporary workflow
        run: |
          git config user.name "executor-phase-c-fix"
          git config user.email "executor-phase-c-fix@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "phase-c: enforce direct-human GitHub origin fail closed"
          git push origin HEAD:phase-b/p4-repeatable-executor-1.0
