name: GP001 product authority request one-shot

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: gp001-product-authority-request
  cancel-in-progress: false

jobs:
  publish-authority-request:
    if: github.repository == 'FJ899/Executor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ github.token }}
      EXECUTOR_GITHUB_EFFECT_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact product runtime
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install exact product runtime
        run: python -m pip install --no-deps .

      - name: Form canonical GP001 request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-authority/effect-evidence
          creative-os-product form \
            --request-id gp001-product-authority-e2e-001 \
            --request 'Napraw regresję atomowości batcha w ProjectRegistry.add_many bez zmiany testów.' \
            --understood-objective 'Naprawić regresję atomowości ProjectRegistry.add_many w dozwolonym pliku i zachować acceptance tests.' \
            --executor-root . \
            --executor-commit "$(git rev-parse HEAD)" \
            > product-authority/formation.json
          python -m json.tool product-authority/formation.json >/dev/null

      - name: Publish zero-authority request transport through Executor runtime
        shell: bash
        run: |
          set -euo pipefail
          creative-os-product publish-authority-request \
            --formation product-authority/formation.json \
            --profile trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/gp001-product-authority.sqlite3" \
            --evidence-dir product-authority/effect-evidence \
            > product-authority/publication.json
          python -m json.tool product-authority/publication.json >/dev/null

      - name: Verify publication reached human-decision boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('product-authority/publication.json').read_text())
          if value.get('status') != 'AWAITING_VERIFIED_HUMAN_DECISION':
              raise SystemExit(f"unexpected publication status: {value.get('status')}")
          transport = value.get('request_transport_provenance', {})
          if transport.get('authority') is not False:
              raise SystemExit('request transport unexpectedly carries authority')
          if transport.get('origin') != 'FORMATION_PUBLISHED_REQUEST':
              raise SystemExit('wrong request transport origin')
          print('ISSUE_URL=' + str(transport.get('object_url')))
          print('ISSUE_ID=' + str(transport.get('object_id')))
          print('DRAFT_SHA256=' + str(value.get('formation_binding', {}).get('draft_sha256')))
          PY

      - name: Preserve formation, publication and effect evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp001-product-authority-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-authority
          if-no-files-found: error
          retention-days: 30
