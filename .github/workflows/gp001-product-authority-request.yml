name: GP001 product authority request renewal one-shot

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp001-product-authority-request.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: gp001-product-authority-request-renewal
  cancel-in-progress: false

jobs:
  publish-authority-request:
    if: github.repository == 'FJ899/Executor' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXECUTOR_GLOBAL_AUTHORITY_REPOSITORY: FJ899/Executor
      EXECUTOR_GLOBAL_AUTHORITY_TOKEN: ${{ github.token }}
      EXECUTOR_GITHUB_EFFECT_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact product runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Arm exactly one fresh request renewal
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          subject="$(git log -1 --format=%s)"
          if [ "$subject" = 'Publish fresh GP001 zero-authority request once' ]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
            echo 'FRESH_REQUEST_RENEWAL_ARMED=true'
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
            echo 'FRESH_REQUEST_RENEWAL_ARMED=false'
          fi

      - name: Set up Python
        if: steps.guard.outputs.armed == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact product runtime
        if: steps.guard.outputs.armed == 'true'
        run: python -m pip install --no-deps .

      - name: Form fresh canonical GP001 request with unchanged task scope
        if: steps.guard.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-authority/effect-evidence
          creative-os-product form \
            --request-id gp001-product-authority-e2e-002 \
            --request 'Napraw regresję atomowości batcha w ProjectRegistry.add_many bez zmiany testów.' \
            --understood-objective 'Naprawić regresję atomowości ProjectRegistry.add_many w dozwolonym pliku i zachować acceptance tests.' \
            --executor-root . \
            --executor-commit "$(git rev-parse HEAD)" \
            > product-authority/formation.json
          python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('product-authority/formation.json').read_text(encoding='utf-8'))
          c=v.get('canonical_contract_request') or {}
          p=c.get('github_request_payload') or {}
          if p.get('request_id') != 'gp001-product-authority-e2e-002':
              raise SystemExit('fresh request id mismatch')
          target=p.get('target') or {}
          if target.get('repository') != 'FJ899/executor-pilot-target' or target.get('commit') != '3934a94a5eebf750079200589d6dc40e024d44a0' or target.get('tree') != '26d307afcbb3ce72b2911ca44936712c11558c4c':
              raise SystemExit('fresh formation changed frozen target identity')
          task=p.get('task') or {}
          if task.get('allowed_paths') != ['project_registry/registry.py'] or task.get('max_production_files') != 1 or task.get('max_patch_lines') != 80:
              raise SystemExit('fresh formation changed bounded task scope')
          print('FRESH_REQUEST_EXPIRES_AT='+str(p.get('expires_at')))
          print('FRESH_DRAFT_SHA256='+str((c.get('formation_binding') or {}).get('draft_sha256')))
          PY

      - name: Publish fresh zero-authority request transport once
        if: steps.guard.outputs.armed == 'true'
        id: publish
        shell: bash
        run: |
          set +e
          creative-os-product publish-authority-request \
            --formation product-authority/formation.json \
            --profile trust_profiles/github-product-gp001.json \
            --ledger "${RUNNER_TEMP}/gp001-product-authority.sqlite3" \
            --evidence-dir product-authority/effect-evidence \
            > product-authority/publication-initial.json
          rc=$?
          set -e
          echo "initial_rc=$rc" >> "$GITHUB_OUTPUT"
          python -m json.tool product-authority/publication-initial.json >/dev/null
          echo "INITIAL_PUBLICATION_RC=$rc"

      - name: Reconcile immediate post-write visibility read-only if required
        if: steps.guard.outputs.armed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from executor.formation_publication_recovery import recover_formation_publication, FormationPublicationRecoveryError
          from executor.github_trust import GitHubRestClient

          initial=json.loads(Path('product-authority/publication-initial.json').read_text(encoding='utf-8'))
          if initial.get('status') == 'AWAITING_VERIFIED_HUMAN_DECISION':
              final=initial
          elif initial.get('status') == 'FORMATION_PUBLICATION_INCOMPLETE':
              try:
                  final=recover_formation_publication(
                      incomplete_publication=initial,
                      evidence_directory=Path('product-authority/effect-evidence'),
                      source=GitHubRestClient(),
                  )
              except FormationPublicationRecoveryError as exc:
                  raise SystemExit(f'read-only formation recovery failed: {exc}')
          else:
              raise SystemExit(f'unexpected initial publication status: {initial.get("status")}')
          Path('product-authority/publication.json').write_text(json.dumps(final,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          if final.get('status') != 'AWAITING_VERIFIED_HUMAN_DECISION':
              raise SystemExit('fresh request did not reach human decision boundary')
          t=final.get('request_transport_provenance') or {}
          if t.get('authority') is not False or t.get('origin') != 'FORMATION_PUBLISHED_REQUEST':
              raise SystemExit('fresh request transport gained authority unexpectedly')
          print('ISSUE_URL='+str(t.get('object_url')))
          print('ISSUE_NUMBER='+str(t.get('object_id')))
          print('DRAFT_SHA256='+str((final.get('formation_binding') or {}).get('draft_sha256')))
          payload=final.get('github_request_payload') or {}
          print('REQUEST_EXPIRES_AT='+str(payload.get('expires_at')))
          print('REQUEST_BODY_SHA256='+__import__('hashlib').sha256(__import__('json').dumps(payload,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode('utf-8')).hexdigest())
          PY

      - name: Preserve fresh formation publication evidence
        if: ${{ always() && steps.guard.outputs.armed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gp001-product-authority-renewal-${{ github.run_id }}-${{ github.run_attempt }}
          path: product-authority
          if-no-files-found: error
          retention-days: 30
