name: GP001 ACCEPT-003 freeze binding diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp001-real-e2e.yml

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  diagnose-accept003-freeze:
    if: github.repository == 'FJ899/Executor' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: FJ899/Executor
          ref: a44032959eec402ebb3f38f456a0a0335e0a742c
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity
        run: test "$(git rev-parse HEAD)" = 'a44032959eec402ebb3f38f456a0a0335e0a742c'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install exact product runtime
        run: python -m pip install --no-deps .

      - name: Download failed ACCEPT-003 freeze evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9623827750
          path: accept003
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33014305193

      - name: Show exact blocker and derive expected pilot draft SHA read only
        shell: bash
        run: |
          set -euo pipefail
          frozen="$(find accept003 -type f -name frozen.json -print -quit)"
          publication="$(find accept003 -type f -name publication.json -print -quit)"
          test -n "$frozen" && test -n "$publication"
          echo '=== EXACT FROZEN RESULT ==='
          cat "$frozen"
          python - "$publication" <<'PY'
          import json,sys
          from executor.github_trust import GitHubRestClient, GitHubTrustProfile
          from executor.pilot_contract import build_pilot_draft_from_formation, pilot_draft_sha256
          from executor.product_github_authority import verify_formation_published_request

          publication=json.load(open(sys.argv[1],encoding='utf-8'))
          canonical=publication['canonical_contract_request']
          payload=canonical['github_request_payload']
          profile=GitHubTrustProfile.from_dict(json.load(open('trust_profiles/github-product-gp001.json',encoding='utf-8')))
          source=GitHubRestClient()
          request=verify_formation_published_request(
              source,
              profile=profile,
              issue_number=90,
              expected_payload=payload,
          )
          draft=build_pilot_draft_from_formation(
              canonical,
              request,
              formation_publication=publication,
          )
          print('FORMATION_DRAFT_SHA256='+canonical['formation_binding']['draft_sha256'])
          print('EXPECTED_PILOT_DRAFT_SHA256='+pilot_draft_sha256(draft))
          print('REQUEST_EXPIRES_AT='+payload['expires_at'])
          PY
