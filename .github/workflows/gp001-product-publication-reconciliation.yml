name: GP001 ACCEPT-002 freeze diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gp001-product-publication-reconciliation.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose-freeze:
    if: github.repository == 'FJ899/Executor' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download ACCEPT-002 failed freeze evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9623244092
          path: failed-freeze
          github-token: ${{ github.token }}
          repository: FJ899/Executor
          run-id: 33012855792

      - name: Inspect freeze result without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILES ==='
          find failed-freeze -type f -print | sort
          frozen="$(find failed-freeze -type f -name frozen.json -print -quit)"
          publication="$(find failed-freeze -type f -name publication.json -print -quit)"
          test -n "$frozen"
          test -n "$publication"
          echo '=== FROZEN RESULT ==='
          cat "$frozen"
          echo '=== PUBLICATION BINDING ==='
          python - "$publication" <<'PY'
          import json,sys
          v=json.load(open(sys.argv[1],encoding='utf-8'))
          print(json.dumps({
            'status':v.get('status'),
            'object_id':(v.get('request_transport_provenance') or {}).get('object_id'),
            'canonical_request_id':(v.get('canonical_contract_request') or {}).get('request_id')
          },sort_keys=True))
          PY
