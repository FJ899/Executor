name: P4 run94 post-merge G-02 status correction candidate

on:
  push:
    branches:
      - reconcile/p4-run94-post-merge-g02-status

permissions:
  contents: read

env:
  BASE_MAIN: 96af1f1c4ace80ca821bb0aaeb17899c6c1039dd
  IMPLEMENTATION_HEAD: 3cd0c8d747fef06f82c01cdab8449c7c8a100038
  TRUSTED_VERIFIER_RUN: "32407901358"
  CONSEQUENTIAL_RUN: "32404181188"

jobs:
  verify-post-merge-g02-status:
    if: ${{ github.ref == 'refs/heads/reconcile/p4-run94-post-merge-g02-status' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact correction candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact base ancestry and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_MAIN" "$GITHUB_SHA"
          test "$(git merge-base "$BASE_MAIN" "$GITHUB_SHA")" = "$BASE_MAIN"
          test -z "$(git status --porcelain --untracked-files=all)"
          python - <<'PY'
          import subprocess

          base = "96af1f1c4ace80ca821bb0aaeb17899c6c1039dd"
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...HEAD"],
                  text=True,
              ).splitlines()
          )
          expected = {
              ".github/workflows/p4-run94-post-merge-g02-status-correction.yml",
              "evidence/phase-c/P4_RUN94_FINAL_CLOSURE_RECONCILIATION_2026-08-20.md",
              "tests/test_p4_run94_final_closure_reconciliation.py",
          }
          assert actual == expected, (actual, expected)
          PY

      - name: Prove post-merge truth and Human-only G-18 boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('evidence/phase-c/P4_RUN94_FINAL_CLOSURE_RECONCILIATION_2026-08-20.md')
          text = p.read_text(encoding='utf-8')
          required = [
              'status: "G-02 PASS / G-18 OPEN"',
              'canonicalized_by_pr: 77',
              'canonical_merge_commit: "96af1f1c4ace80ca821bb0aaeb17899c6c1039dd"',
              'claim_reconciliation_authority: "CANONICALIZED_BY_AUTHORIZED_MERGE_PR_77"',
              'G-02: PASS',
              'G-13: PASS',
              'G-15: PASS',
              'G-16: PASS',
              'G-17: PASS',
              'G-18: OPEN_HUMAN_ONLY',
              'PROJECT COMPLETION: BLOCKED ONLY ON G-18',
              'g18_authority: "NONE"',
              'merge_authority: "NONE"',
              'release_authority: "NONE"',
              'deploy_authority: "NONE"',
              'tag_authority: "NONE"',
          ]
          for token in required:
              assert token in text, token

          stale = [
              'version: "1.0-candidate"',
              'status: "NON-CANONICAL CANDIDATE / G-18 OPEN"',
              'claim_reconciliation_authority: "CANDIDATE_ONLY"',
              'G-02: CANDIDATE_READY_NOT_CANONICAL',
              'G-02: CANDIDATE READY / NOT CANONICAL',
              'CLAIM RECONCILIATION: CANDIDATE ONLY / NOT MERGED',
          ]
          for token in stale:
              assert token not in text, token

          assert 'EXECUTOR 1.0 FINAL ACCEPTANCE FOR 3cd0c8d...: NOT YET CREATED' in text
          PY

      - name: Prove workflow remains non-consequential
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/p4-run94-post-merge-g02-status-correction.yml').read_text(encoding='utf-8')
          assert 'permissions:\n  contents: read' in text
          for token in ('github' + '-pilot-decide', 'materialize' + '-pilot-proposal', 'run' + '-pilot'):
              assert token not in text, token
          PY

      - name: Run focused and repository tests
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q executor tools tests
          python -m unittest tests.test_p4_run94_final_closure_reconciliation -v
          python -m unittest discover -s tests -v

      - name: Final non-consequential summary
        shell: bash
        run: |
          set -euo pipefail
          echo "P4_RUN94_POST_MERGE_G02_STATUS_CORRECTION_CANDIDATE=PASS"
          echo "BASE_MAIN=$BASE_MAIN"
          echo "IMPLEMENTATION_HEAD=$IMPLEMENTATION_HEAD"
          echo "TRUSTED_VERIFIER_RUN=$TRUSTED_VERIFIER_RUN"
          echo "CONSEQUENTIAL_RUN=$CONSEQUENTIAL_RUN"
          echo "RECORDED_G02=PASS"
          echo "G18=OPEN_HUMAN_ONLY"
          echo "CONSEQUENTIAL_EXECUTIONS=0"
          echo "EFFECT_CONSUMPTIONS=0"
          echo "HUMAN_ACCEPT_CONSUMPTIONS=0"
          echo "MERGE=0"
          echo "RELEASE=0"
          echo "DEPLOY=0"
          echo "TAG=0"
